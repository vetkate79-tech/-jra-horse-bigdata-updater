<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JRA AI｜今日の注目レース</title><meta name="description" content="JRA AIがレースを安定型・標準型・穴狙い型・見送りに分け、期待値の高い順に紹介。自分の予想とAI予想の答え合わせもできます。"><meta name="robots" content="index,follow,max-snippet:-1"><meta name="theme-color" content="#0d1712"><style>:root{--bg:#f5f6f3;--paper:#fff;--ink:#0f1713;--muted:#6b766f;--line:#dfe5e0;--green:#08704a;--soft:#e8f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:72px}.top{position:sticky;top:0;z-index:30;height:54px;background:rgba(245,246,243,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px}.brand{font-weight:900;text-decoration:none;color:var(--ink)}.top nav{display:none;gap:18px}.top nav a{text-decoration:none;color:var(--ink);font-size:12px;font-weight:800}.wrap{max-width:920px;margin:auto;padding:18px 14px 28px}.hero{padding:18px 2px 8px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.12em;color:var(--green)}h1{font-size:31px;line-height:1.15;margin:7px 0 8px;letter-spacing:-.03em}.hero p{font-size:13px;color:var(--muted);line-height:1.65;margin:0}.week{display:block;margin:18px 0 10px;padding:15px 16px;border-radius:18px;background:var(--ink);color:#fff;text-decoration:none}.week small{display:block;font-size:10px;opacity:.7}.week b{display:block;font-size:17px;margin-top:5px}.replay{display:flex;align-items:center;justify-content:space-between;margin:0 0 22px;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink);text-decoration:none}.replay b{font-size:13px}.replay small{display:block;font-size:9px;color:var(--muted);margin-top:3px}.section{margin-top:26px}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:10px}.section-head h2{font-size:19px;margin:0}.section-head span{font-size:10px;color:var(--muted)}.type-block{margin:12px 0 20px}.type-title{display:flex;align-items:center;gap:8px;margin-bottom:9px}.type-title b{font-size:16px}.type-title small{font-size:10px;color:var(--muted)}.race-list{display:grid;gap:8px}.race{display:block;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:13px 14px;color:var(--ink);text-decoration:none}.race-top{display:flex;justify-content:space-between;gap:10px}.race strong{font-size:16px}.race small{font-size:10px;color:var(--muted)}.ev{font-size:11px;font-weight:900;color:var(--green);white-space:nowrap}.race p{font-size:11px;color:var(--muted);margin:8px 0 0}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-size:11px}.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}.links a{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--ink);font-weight:900;font-size:12px}.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-align:center;text-decoration:none;color:#5f6a64;font-size:10px;font-weight:900;padding:12px 2px}.mobile-nav a.active{color:var(--green)}@media(min-width:760px){body{padding-bottom:0}.top nav{display:flex}.mobile-nav{display:none}.race-list{grid-template-columns:repeat(2,1fr)}h1{font-size:42px}.wrap{padding-top:28px}}</style></head><body><header class="top"><a class="brand" href="./">JRA AI</a><nav><a href="./app/">予想を答え合わせ</a><a href="./horses/">馬データ</a><a href="./consult/">相談</a><a href="./about/">このサイトについて</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow">TODAY'S RACE GUIDE</div><h1>今日見るべきレースを、<br>先に。</h1><p>レースの特徴ごとに分けて、AIの期待値が高い順に並べます。記号ではなく、日本語で分かる表示に統一します。</p></section><a class="week" href="./horses/week/2026-09-05-06/"><small>NEXT WEEK</small><b>9/5・9/6 今週の出走馬を見る →</b></a><a class="replay" href="./replay/"><span><b>8/29・8/30 予想 → 結果を見る</b><small>本番画面の実装確認用プレビュー</small></span><span>›</span></a><section class="section"><div class="section-head"><h2>注目レース</h2><span>各タイプ内で期待値順</span></div><div id="types"></div></section><section class="links"><a href="./app/">自分の予想をAIと答え合わせ →</a><a href="./horses/">馬データを検索 →</a><a href="./consult/">競馬のことをAIに相談 →</a><a href="./about/">このサイトについて →</a></section></main><nav class="mobile-nav"><a class="active" href="./">ホーム</a><a href="./app/">予想</a><a href="./horses/">データ</a><a href="./consult/">相談</a></nav><script>const TYPES=[['A','安定型','軸や上位評価の信頼が比較的高いレース'],['B','標準型','能力と展開をバランスよく見るレース'],['C','穴狙い型','人気薄や展開のズレに妙味が出やすいレース'],['D','見送り','不確実性が高く、無理に狙わないレース']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function code(r){const c=String(r.classification||r.race_grade||r.type_grade||'').toUpperCase();if(c==='PASS')return'D';return['A','B','C','D'].includes(c)?c:'B'}function evNum(r){const n=Number(r.ev??r.expected_value??r.value_score);return Number.isFinite(n)?n:null}function evText(r){const n=evNum(r);return n==null?'期待値 判定待ち':`期待値 ${n.toFixed(2)}`}function render(data){const races=data.races||[];document.querySelector('#types').innerHTML=TYPES.map(([k,name,desc])=>{const rs=races.filter(r=>code(r)===k).sort((a,b)=>(evNum(b)??-Infinity)-(evNum(a)??-Infinity));return `<section class="type-block"><div class="type-title"><b>${name}</b><small>${desc}</small></div><div class="race-list">${rs.length?rs.slice(0,6).map(r=>`<a class="race" href="./app/#today"><div class="race-top"><div><strong>${esc(r.track||'')} ${esc(r.race_no||'')}R</strong><br><small>${esc(r.start_time||'--')} ${esc(r.surface||'')} ${esc(r.distance||r.distance_m||'')}m</small></div><span class="ev">${evText(r)}</span></div><p>${esc(r.race_name||r.ticket_summary||'AI予想を確認')}</p></a>`).join(''):`<div class="empty">このタイプのレースはまだ判定前です。</div>`}</div></section>`}).join('')}fetch('./data/dashboard.json',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>render({races:[]}));</script></body></html>
