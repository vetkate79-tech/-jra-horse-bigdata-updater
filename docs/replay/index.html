<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>過去の事前予想｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--red:#b63a31;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:860px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;line-height:1.2;margin:7px 0 8px}.hero p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}.notice{margin:16px 0;background:#fff7df;border:1px solid #ecdcaa;border-radius:14px;padding:12px;font-size:11px;line-height:1.55}.months,.dates{display:flex;gap:8px;overflow:auto}.months{margin:20px 0 10px}.dates{margin:0 0 12px}.months button,.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.months button.active,.dates button.active{background:var(--ink);color:#fff}.months button.locked{color:#8b948f}.months button.future{color:#aeb5b1;background:#f3f5f3;cursor:not-allowed}.count{font-size:10px;color:var(--muted);margin:0 2px 10px}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:10px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.pre{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.pre>small{font-size:9px;color:var(--green);font-weight:900;letter-spacing:.06em}.axis-label{font-size:10px;color:var(--muted);margin-top:8px}.axis{font-size:22px;font-weight:900;margin:2px 0 10px}.line{font-size:12px;line-height:1.65;color:#364139}.line b{display:inline-block;min-width:34px}.note{margin-top:8px;font-size:10px;line-height:1.55;color:var(--muted)}.ticket{margin-top:10px;background:#f5f7f5;border-radius:11px;padding:10px;font-size:11px;font-weight:800;line-height:1.55}.result-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.result-details summary{font-size:11px;color:var(--muted);font-weight:900;cursor:pointer;list-style:none}.result-details summary::-webkit-details-marker{display:none}.result-details summary:after{content:'＋';float:right}.result-details[open] summary:after{content:'−'}.result{margin-top:10px;padding:11px;border-radius:12px;background:#f5f7f5}.result.hit{background:#e8f5ee}.result.miss{background:#fbefed}.result-top{display:flex;align-items:center;justify-content:space-between}.result-top b{font-size:14px}.hit .result-top b{color:var(--green)}.miss .result-top b{color:var(--red)}.result p{font-size:11px;line-height:1.55;margin:7px 0 0}.result-ranks{font-size:11px;line-height:1.6;margin-top:8px}.payout{font-size:11px;font-weight:900}.premium{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--line);background:#fff;padding:16px;margin-top:8px}.blur-list{display:grid;gap:9px;filter:blur(6px);opacity:.52;pointer-events:none}.blur-card{height:118px;border-radius:14px;background:linear-gradient(180deg,#eef1ee,#fff);border:1px solid var(--line);padding:14px}.blur-card b,.blur-card span{display:block;background:#cfd6d1;border-radius:99px}.blur-card b{width:42%;height:16px}.blur-card span{width:78%;height:10px;margin-top:12px}.lockbox{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(245,247,245,.52);backdrop-filter:blur(1px)}.lockpanel{max-width:330px;text-align:center;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 35px rgba(20,30,24,.08)}.lockicon{font-size:22px}.lockpanel h3{margin:7px 0 6px;font-size:17px}.lockpanel p{margin:0;color:var(--muted);font-size:11px;line-height:1.6}.soon{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:99px;background:var(--ink);color:#fff;font-size:9px;font-weight:900}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">予想ページ</a></header><main class="wrap"><section class="hero"><small>PRE-RACE ARCHIVE</small><h1>過去の事前予想</h1><p>発走前にどう見ていたかをそのまま残します。的中・不的中より、本命・相手・穴の考え方が主役です。</p></section><div class="notice">2026年3月〜12月を月ごとに表示します。常に直近2か月分は閲覧可能で、それより前の月は過去アーカイブとして非公開表示になります。</div><div id="months" class="months"></div><div id="dates" class="dates"></div><div id="count" class="count"></div><div id="content"></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let races=[],date='ALL';const tzParts=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit'}).formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const currentYear=Number(tzParts.year),currentMonth=Number(tzParts.month);const archiveYear=2026;const freeMonths=new Set([currentMonth-1,currentMonth].filter(m=>m>=3&&m<=12));let month=`2026-${String(Math.min(12,Math.max(3,currentMonth))).padStart(2,'0')}`;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const arr=v=>Array.isArray(v)?v:[];function monthState(m){if(currentYear<archiveYear||m>currentMonth)return'future';if(freeMonths.has(m))return'free';return'locked'}function monthTabs(){const months=Array.from({length:10},(_,i)=>i+3);$('#months').innerHTML=months.map(m=>{const key=`2026-${String(m).padStart(2,'0')}`,s=monthState(m);const icon=s==='locked'?'🔒 ':'';const suffix=s==='future'?'・今後':'';return `<button class="${month===key?'active ':''}${s}" data-month="${key}" ${s==='future'?'disabled':''}>${icon}${m}月${suffix}</button>`}).join('');$$('[data-month]:not([disabled])').forEach(b=>b.onclick=()=>{month=b.dataset.month;date='ALL';monthTabs();render()})}function renderDates(rows,free){if(!free){$('#dates').innerHTML='';return}const ds=[...new Set(rows.map(r=>r.date))].sort().reverse();$('#dates').innerHTML=`<button class="${date==='ALL'?'active':''}" data-date="ALL">${Number(month.slice(5))}月すべて</button>`+ds.map(d=>`<button class="${date===d?'active':''}" data-date="${d}">${Number(d.slice(8))}日</button>`).join('');$$('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;render()})}function premium(){return `<section class="premium"><div class="blur-list">${Array.from({length:6},()=>`<div class="blur-card"><b></b><span></span><span style="width:62%"></span><span style="width:48%"></span></div>`).join('')}</div><div class="lockbox"><div class="lockpanel"><div class="lockicon">🔒</div><h3>${Number(month.slice(5))}月の過去アーカイブ</h3><p>無料で見られるのは直近2か月分です。それ以前のアーカイブ公開機能は準備中です。</p><span class="soon">PREMIUM 準備中</span></div></div></section>`}function card(r){return `<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${r.date.replaceAll('-','/')} · ${esc(r.surface||'')} ${r.distance_m?esc(r.distance_m)+'m':''}</small></div><span class="badge">${esc(r.type_label||'事前予想')}</span></div><section class="pre"><small>発走前の見立て</small><div class="axis-label">本命・中心</div><div class="axis">${esc(r.axis||'記録あり')}</div><div class="line"><b>相手</b> ${arr(r.partners).map(esc).join(' / ')||'記録なし'}</div><div class="line"><b>穴</b> ${arr(r.holes).map(esc).join(' / ')||'記録なし'}</div>${r.pre_note?`<div class="note">${esc(r.pre_note)}</div>`:''}${r.formation?`<div class="ticket">${esc(r.formation)}${r.ticket_count?`<br>${r.ticket_count}点`:''}</div>`:''}</section>${arr(r.result_top3).length?`<details class="result-details"><summary>結果を確認する</summary><div class="result ${r.hit?'hit':'miss'}"><div class="result-top"><b>${r.hit?'的中':'不的中'}</b>${r.hit&&r.return_amount?`<span class="payout">払戻 ${Number(r.return_amount).toLocaleString()}円</span>`:''}</div><div class="result-ranks">${arr(r.result_top3).map((x,i)=>`${i+1}着 ${esc(x)}`).join('<br>')}${r.trio_result?`<br>三連複 ${esc(r.trio_result)}${r.trio_payout?` ／ ${Number(r.trio_payout).toLocaleString()}円`:''}`:''}</div>${r.review?`<p>${esc(r.review)}</p>`:''}</div></details>`:''}</article>`}function render(){const m=Number(month.slice(5)),state=monthState(m),monthly=races.filter(r=>r.date&&r.date.startsWith(month));if(state==='locked'){renderDates([],false);$('#count').textContent='過去アーカイブ';$('#content').innerHTML=premium();return}renderDates(monthly,true);const rows=monthly.filter(r=>date==='ALL'||r.date===date).sort((a,b)=>b.date.localeCompare(a.date)||(a.race_no||0)-(b.race_no||0));$('#count').textContent=`${rows.length}レース掲載`;$('#content').innerHTML=`<div class="list">${rows.map(card).join('')||'<div class="empty">この月の事前予想データは準備中です。</div>'}</div>`}fetch('../data/replay-demo-2026-08-29-30.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{races=d.races||[];monthTabs();render()});</script></body></html>
