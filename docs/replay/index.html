<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8月検証結果｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:920px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;margin:7px 0 8px}.hero p,.notice{font-size:12px;line-height:1.7;color:var(--muted)}.notice{margin:16px 0;background:#fff7df;border:1px solid #ecdcaa;border-radius:14px;padding:12px}.dates{display:flex;gap:8px;overflow:auto;margin:18px 0 12px}.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.dates button.active{background:var(--ink);color:#fff}.count{font-size:10px;color:var(--muted);margin-bottom:10px}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:9px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.section{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}.label{font-size:9px;color:var(--muted);font-weight:900}.axis{font-size:20px;font-weight:900;margin:4px 0}.line{font-size:11px;line-height:1.65;color:#39463f}.result{margin-top:10px;padding:10px;border-radius:12px;background:#f5f7f5}.result.hit{background:#e8f5ee}.result.miss{background:#fbefed}.top3{font-weight:900;font-size:12px;line-height:1.7}.tickets{margin-top:7px;font-size:10px;color:var(--muted);line-height:1.7}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">最新予想</a></header><main class="wrap"><section class="hero"><small>FIXED AUGUST VALIDATION</small><h1>8月検証結果</h1><p>2026年8月のJRA全10開催日・360Rを、1Rにつき代表予想1件で固定保存します。</p></section><div class="notice">これは実際の発走前会話ログではなく、結果を見ない状態で封印した検証予想の固定アーカイブです。モデル比較で生成された複数候補は公開せず、各レース1予想だけ表示します。</div><div id="dates" class="dates"></div><div id="count" class="count">読込中</div><div id="content"></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">最新予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let races=[],date='ALL';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmtAxis=p=>[p.axis_no,p.axis_name].filter(Boolean).join(' ');function renderDates(){const ds=[...new Set(races.map(r=>r.date))].sort().reverse();$('#dates').innerHTML=`<button class="${date==='ALL'?'active':''}" data-date="ALL">全360R</button>`+ds.map(d=>`<button class="${date===d?'active':''}" data-date="${d}">${Number(d.slice(5,7))}/${Number(d.slice(8))}</button>`).join('');$$('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;renderDates();render()})}function card(r){const p=r.prediction||{},z=r.result||{},top=(z.top3||[]).map(x=>`${x.finish}着 ${x.horse_no} ${x.horse_name||''}`).join(' / ');const axisOk=z.axis_top3===true;const axisKnown=z.axis_top3===true||z.axis_top3===false;const cls=axisKnown?(axisOk?'hit':'miss'):'';const cand=(p.candidate||[]).join('・')||'—';const tickets=(p.tickets||[]);return `<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${esc(r.date).replaceAll('-','/')}</small></div><span class="badge">固定検証</span></div><div class="section"><div class="label">代表予想</div><div class="axis">軸 ${esc(fmtAxis(p)||'—')}</div><div class="line">判定：${esc(p.decision||'—')}</div><div class="line">候補：${esc(cand)}</div>${tickets.length?`<div class="tickets">三連複：${tickets.map(esc).join(' / ')}</div>`:''}</div><div class="result ${cls}"><div class="label">実結果</div><div class="top3">${esc(top||'結果データなし')}</div><div class="line">軸結果：${z.axis_finish?esc(z.axis_finish)+'着':'—'}${axisKnown?` / ${axisOk?'3着内':'4着以下'}`:''}${z.trio_hit===true?' / 三連複的中':z.trio_hit===false?' / 三連複不的中':''}</div></div></article>`}function render(){const rows=races.filter(r=>date==='ALL'||r.date===date).sort((a,b)=>b.date.localeCompare(a.date)||a.track.localeCompare(b.track)||a.race_no-b.race_no);$('#count').textContent=`${rows.length}レース表示`;$('#content').innerHTML=`<div class="list">${rows.map(card).join('')||'<div class="empty">検証データを生成中です。</div>'}</div>`}fetch('../data/august-validation-archive.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{races=d.races||[];renderDates();render()}).catch(()=>{$('#count').textContent='生成待ち';$('#content').innerHTML='<div class="empty">固定アーカイブの生成を確認中です。</div>'});</script></body></html>
