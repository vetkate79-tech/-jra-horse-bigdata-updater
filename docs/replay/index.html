<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8/29・8/30 予想と結果｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--red:#b63a31;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:860px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;line-height:1.2;margin:7px 0 8px}.hero p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}.notice{margin:16px 0;background:#fff7df;border:1px solid #ecdcaa;border-radius:14px;padding:12px;font-size:11px;line-height:1.55}.dates{display:flex;gap:8px;overflow:auto;margin:20px 0 12px}.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.dates button.active{background:var(--ink);color:#fff}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:10px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.split{display:grid;grid-template-columns:1fr;gap:9px;margin-top:12px}.box{border-top:1px solid var(--line);padding-top:11px}.box>small{font-size:9px;color:var(--muted);font-weight:900}.axis{font-size:18px;font-weight:900;margin:5px 0}.line{font-size:11px;line-height:1.6;color:#364139}.ticket{margin-top:8px;background:#f5f7f5;border-radius:10px;padding:9px;font-size:11px;font-weight:800}.result{margin-top:12px;padding:11px;border-radius:12px;background:#f5f7f5}.result.hit{background:#e8f5ee}.result.miss{background:#fbefed}.result-top{display:flex;align-items:center;justify-content:space-between}.result-top b{font-size:14px}.hit .result-top b{color:var(--green)}.miss .result-top b{color:var(--red)}.result p{font-size:11px;line-height:1.55;margin:7px 0 0}.payout{font-size:11px;font-weight:900}.review{margin-top:9px;font-size:11px;color:#3f4b44;line-height:1.6}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.split{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">予想ページ</a></header><main class="wrap"><section class="hero"><small>HISTORICAL PREVIEW</small><h1>8/29・8/30<br>予想 → 結果</h1><p>本番サイトで予想公開後に結果がどう見えるかを確認するための表示サンプルです。</p></section><div class="notice">このページは実装確認用です。予想欄と結果欄を分離し、結果を見て予想を書き換えない構造を再現しています。正式な未見成績やモデル成績には加算しません。</div><div class="dates"><button class="active" data-date="ALL">両日</button><button data-date="2026-08-30">8/30</button><button data-date="2026-08-29">8/29</button></div><div id="list" class="list"></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let races=[],date='ALL';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){const rows=races.filter(r=>date==='ALL'||r.date===date);$('#list').innerHTML=rows.map(r=>`<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${r.date.replaceAll('-','/')} · ${esc(r.surface)}${r.distance_m}m</small></div><span class="badge">${esc(r.type_label)}</span></div><div class="split"><section class="box"><small>開始前の予想</small><div class="axis">本命 ${esc(r.axis)}</div><div class="line"><b>相手</b> ${r.partners.map(esc).join(' / ')||'—'}</div><div class="line"><b>穴</b> ${r.holes.map(esc).join(' / ')||'—'}</div><div class="ticket">${esc(r.formation)}<br>${r.ticket_count}点・${Number(r.stake).toLocaleString()}円</div></section><section class="box"><small>レース結果</small><div class="axis">${r.result_top3.map((x,i)=>`${i+1}着 ${esc(x)}`).join('<br>')}</div><div class="line">三連複 ${esc(r.trio_result)} ／ ${Number(r.trio_payout).toLocaleString()}円</div></section></div><div class="result ${r.hit?'hit':'miss'}"><div class="result-top"><b>${r.hit?'的中':'不的中'}</b>${r.hit?`<span class="payout">払戻 ${Number(r.return_amount||r.trio_payout).toLocaleString()}円</span>`:''}</div><p>${esc(r.review)}</p></div></article>`).join('')||'<div class="empty">該当データなし</div>'}$$('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;$$('[data-date]').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('../data/replay-demo-2026-08-29-30.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{races=d.races||[];render()});</script></body></html>
