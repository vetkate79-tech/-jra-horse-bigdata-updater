<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>過去レースのAI予測｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--soft:#e9f4ee;--lock:#edf0ee;--result:#fff4dc;--win:#e5f4eb;--place:#e8f2fb;--miss:#fbefed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:920px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;margin:7px 0 8px}.hero p,.notice{font-size:12px;line-height:1.7;color:var(--muted)}.notice{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.months,.dates{display:flex;gap:8px;overflow:auto;margin:16px 0 10px}.months button,.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.months button.active,.dates button.active{background:var(--ink);color:#fff}.months button.locked{background:var(--lock);color:#8a938e}.dates button.locked-day{background:var(--lock);color:#8a938e;border-style:dashed;cursor:not-allowed}.day-lock-note{margin:0 0 12px;padding:11px 12px;border-radius:12px;background:#fff;border:1px dashed #bfc9c2;color:#6f7a74;font-size:11px;font-weight:800}.locked-panel{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:12px}.blur{filter:blur(5px);opacity:.35;user-select:none}.lock-message{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-weight:900}.lock-message span{font-size:28px}.count{font-size:10px;color:var(--muted);margin-bottom:10px}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:9px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.section{margin-top:11px;border-top:1px solid var(--line);padding-top:10px}.label{font-size:9px;color:var(--muted);font-weight:900}.axis{font-size:20px;font-weight:900;margin:4px 0}.line{font-size:11px;line-height:1.65;color:#39463f}.tickets{margin-top:7px;font-size:10px;color:var(--muted);line-height:1.7}details.result{margin-top:10px;border-radius:12px;background:var(--result);padding:0 10px;transition:background .18s ease}details.result[open]{padding-bottom:10px}details.result.win[open]{background:var(--win)}details.result.place[open]{background:var(--place)}details.result.miss[open]{background:var(--miss)}summary{cursor:pointer;list-style:none;font-size:11px;font-weight:900;padding:11px 0}summary::-webkit-details-marker{display:none}details.trio-result{margin-top:9px;border-top:1px dashed rgba(70,90,78,.22);padding-top:2px}details.trio-result summary{color:#32463b;padding:10px 0 7px}.trio-box{padding:8px 0 2px}.trio-status{font-size:12px;font-weight:900;margin-bottom:5px}.trio-payout{font-size:15px;font-weight:900;color:var(--green);margin:4px 0}.top3{font-weight:900;font-size:12px;line-height:1.7}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">最新予想</a></header><main class="wrap"><section class="hero"><small>AI RACE ARCHIVE</small><h1>過去レースのAI予測</h1><p>各レース1つのAI予測を固定して保存。予測内容を見たあと、タップして実際の結果を確認できます。</p></section><div class="notice">9月・8月を公開中。確定したレースは封印済みAI予測とJRA公式結果を同じカードで確認できます。7月以前はロック表示を維持します。</div><div class="months" id="months"><button class="active" data-month="2026-09">9月</button><button data-month="2026-08">8月</button><button class="locked" data-month="2026-07">🔒 7月</button><button class="locked" data-month="2026-06">🔒 6月</button><button class="locked" data-month="2026-05">🔒 5月</button><button class="locked" data-month="2026-04">🔒 4月</button></div><div id="lockedView" class="locked-panel" hidden><div class="blur">札幌 11R　軸 7　候補 2・5・9<br>新潟 10R　軸 4　候補 1・6・12<br>中京 9R　軸 3　候補 5・8・11</div><div class="lock-message"><span>🔒</span><div>7月以前のAI予測は現在ロック中</div></div></div><div id="openView"><div id="dates" class="dates"></div><div id="tracks" class="dates"></div><div id="count" class="count">読込中</div><div id="content"></div></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">最新予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let races=[],date='ALL',track='ALL',month='2026-09',archives={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const axis=p=>[p.axis_no||p.axis?.horse_no,p.axis_name||p.axis?.horse_name].filter(Boolean).join(' ');
function resultClass(z){const f=Number(z.axis_finish);if(f===1)return'win';if(f===2||f===3)return'place';if(Number.isFinite(f)&&f>=4)return'miss';return''}
function resultLabel(z){const f=Number(z.axis_finish);if(f===1)return'1着・的中';if(f===2)return'2着・馬券内';if(f===3)return'3着・馬券内';if(Number.isFinite(f)&&f>=4)return '4着以下・馬券外（軸不的中）';return'結果照合待ち'}
function toNums(top3){const map={'⓪':'0','①':'1','②':'2','③':'3','④':'4','⑤':'5','⑥':'6','⑦':'7','⑧':'8','⑨':'9','⑩':'10','⑪':'11','⑫':'12','⑬':'13','⑭':'14','⑮':'15','⑯':'16','⑰':'17','⑱':'18','⑲':'19','⑳':'20'};return String(top3||'').split('－').map(x=>{let s='';for(const ch of x.trim())s+=map[ch]??ch;return s.replace(/\D/g,'')}).filter(Boolean)}
function liveArchive(live,res){
  const resultBy=new Map((res.races||[]).filter(x=>x.date==='2026-09-05').map(x=>[[x.date,x.track,+x.race_no].join('|'),x]));
  const predBy=new Map((live.races||[]).filter(x=>x.date==='2026-09-05').map(x=>[[x.date,x.track,+x.race_no].join('|'),x]));
  const keys=[...new Set([...resultBy.keys(),...predBy.keys()])];
  return keys.map(key=>{
    const rr=resultBy.get(key),x=predBy.get(key);
    const [d,t,rn]=key.split('|'),a=x?.analysis||{};
    const nums=(rr?.top3_rows||[]).length?rr.top3_rows.map(y=>String(y.horse_no||'')):toNums(rr?.top3);
    const names=(rr?.top3_rows||[]).length?rr.top3_rows.map(y=>y.horse_name||''):nums.map(()=> '');
    const ax=String(a.axis?.horse_no||rr?.axis_horse_no||'');
    const finish=ax?(nums.indexOf(ax)>=0?nums.indexOf(ax)+1:(nums.length===3?4:null)):null;
    const tickets=a.trio_tickets||[];
    const actual=nums.length===3?[...nums].map(Number).sort((a,b)=>a-b).join('-'):null;
    const trioHit=rr?.trio_hit===true?true:rr?.trio_hit===false?false:(x&&actual?tickets.includes(actual):null);
    return {
      date:d,track:t,race_no:+rn,race_name:x?.race_name||rr?.race_name||'',
      prediction:x?{
        sealed:true,
        axis_no:ax,axis_name:a.axis?.horse_name||rr?.axis_horse_name||'',
        decision:a.pre_market_decision||a.classification||'—',
        candidate:(a.partner_roles||[]).slice(0,5).map(y=>[y.horse_no,y.horse_name].filter(Boolean).join(' ')),
        tickets
      }:{sealed:false},
      result:rr?{
        axis_finish:finish,
        top3:nums.map((n,i)=>({finish:i+1,horse_no:n,horse_name:names[i]||''})),
        trio_hit:trioHit,
        trio_payout:rr.trio_payout||'',
        source:rr.source||''
      }:{}
    }
  })
}
function renderDates(){
  const ds=[...new Set(races.map(r=>r.date))].sort().reverse();
  const lock96=month==='2026-09'?'<button class="locked-day" type="button" disabled>🔒 9/6</button>':'';
  $('#dates').innerHTML=`<button class="${date==='ALL'?'active':''}" data-date="ALL">全${races.length}R</button>`+
    ds.map(d=>`<button class="${date===d?'active':''}" data-date="${d}">${Number(d.slice(5,7))}/${Number(d.slice(8))}</button>`).join('')+lock96;
  $$('#dates [data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;track='ALL';renderDates();renderTracks();render()})
}
function renderTracks(){
  const base=(archives[month]||[]).filter(r=>date==='ALL'||r.date===date);
  const ts=[...new Set(base.map(r=>r.track))].sort();
  $('#tracks').innerHTML=`<button class="${track==='ALL'?'active':''}" data-track="ALL">全競馬場</button>`+ts.map(t=>`<button class="${track===t?'active':''}" data-track="${esc(t)}">${esc(t)}</button>`).join('');
  $('#tracks [data-track]').forEach(b=>b.onclick=()=>{track=b.dataset.track;renderTracks();render()});
}
function trioDetails(p,z,hasResult){
  const tickets=p.tickets||[];
  if(!tickets.length)return '<details class="trio-result"><summary>推奨三連複の判定を見る ▼</summary><div class="trio-box"><div class="line">推奨三連複の発行なし</div></div></details>';
  let status='結果確定待ち',payout='';
  if(hasResult&&z.trio_hit===true){status='◎ 推奨三連複 的中';payout=z.trio_payout&&z.trio_payout!=='払戻確認中'?'<div class="trio-payout">払戻 '+esc(z.trio_payout)+'</div>':'<div class="line">払戻確認中</div>'}
  else if(hasResult&&z.trio_hit===false){status='× 推奨三連複 不的中'}
  return `<details class="trio-result"><summary>推奨三連複の判定を見る ▼</summary><div class="trio-box"><div class="trio-status">${status}</div>${payout}<div class="tickets">推奨買い目：${tickets.map(esc).join(' / ')}</div></div></details>`
}
function card(r){
  const p=r.prediction||{},z=r.result||{},
    top=(z.top3||[]).map(x=>`${x.finish}着 ${x.horse_no} ${x.horse_name||''}`).join(' / '),
    cand=(p.candidate||[]).join('・')||'—',
    tickets=p.tickets||[],cls=resultClass(z),hasResult=(z.top3||[]).length>0;
  return `<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${esc(r.date).replaceAll('-','/')}</small></div><span class="badge">${p.sealed===false?'事前封印なし':'封印AI予測'}</span></div>
  <div class="section"><div class="label">AI予測</div>${p.sealed===false?'<div class="line">このレースは発走前の正式封印がないため、予想成績の判定対象外です。</div>':`<div class="axis">軸 ${esc(axis(p)||'—')}</div><div class="line">判定：${esc(p.decision||'—')}</div><div class="line">候補：${esc(cand)}</div>${tickets.length?`<div class="tickets">推奨三連複：${tickets.map(esc).join(' / ')}</div>`:''}`}</div>
  <details class="result ${cls}"><summary>${hasResult?'軸の結果を見る ▼':'結果確定待ち'}</summary><div class="label">JRA公式結果</div><div class="top3">${esc(top||'結果データなし')}</div><div class="line">軸結果：${esc(resultLabel(z))}</div>${z.source?`<div class="line"><a href="${esc(z.source)}" target="_blank" rel="noreferrer">JRA公式結果</a></div>`:''}${trioDetails(p,z,hasResult)}</details></article>`
}
function render(){
  races=archives[month]||[];
  const rows=races.filter(r=>(date==='ALL'||r.date===date)&&(track==='ALL'||r.track===track)).sort((a,b)=>b.date.localeCompare(a.date)||a.track.localeCompare(b.track)||a.race_no-b.race_no);
  $('#count').textContent=`${rows.length}レース表示`;
  const lockNote=month==='2026-09'?'<div class="day-lock-note">🔒 9/6は全レース終了までロック。終了後に封印済み予測と結果を過去レースへ移動します。</div>':'';
  $('#content').innerHTML=lockNote+`<div class="list">${rows.map(card).join('')||'<div class="empty">データ整備中です。</div>'}</div>`
}
function selectMonth(m,b){
  month=m;date='ALL';track='ALL';$$('#months button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  const locked=b.classList.contains('locked');$('#lockedView').hidden=!locked;$('#openView').hidden=locked;
  if(!locked){races=archives[month]||[];renderDates();renderTracks();render()}
}
$$('#months [data-month]').forEach(b=>b.onclick=()=>selectMonth(b.dataset.month,b));
Promise.all([
  fetch('../data/august-validation-archive.json',{cache:'no-store'}).then(r=>r.ok?r.json():{races:[]}),
  fetch('../data/live_predictions_sealed.json',{cache:'no-store'}).then(r=>r.ok?r.json():{races:[]}),
  fetch('../data/today-results-2026-09-05.json',{cache:'no-store'}).then(r=>r.ok?r.json():{races:[]})
]).then(([aug,live,res])=>{
  archives['2026-08']=aug.races||[];
  archives['2026-09']=liveArchive(live,res);
  races=archives[month];renderDates();renderTracks();render()
}).catch(()=>{
  $('#count').textContent='データ整備中';
  $('#content').innerHTML='<div class="empty">AI予測アーカイブを整備中です。</div>'
});
</script><script src="/-jra-horse-bigdata-updater/word-links.js"></script></body></html>
