<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>8/29・8/30 過去の事前予想｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--red:#b63a31;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:860px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;line-height:1.2;margin:7px 0 8px}.hero p{font-size:12px;color:var(--muted);line-height:1.65;margin:0}.notice{margin:16px 0;background:#fff7df;border:1px solid #ecdcaa;border-radius:14px;padding:12px;font-size:11px;line-height:1.55}.dates{display:flex;gap:8px;overflow:auto;margin:20px 0 12px}.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.dates button.active{background:var(--ink);color:#fff}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:10px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.pre{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.pre>small{font-size:9px;color:var(--green);font-weight:900;letter-spacing:.06em}.axis-label{font-size:10px;color:var(--muted);margin-top:8px}.axis{font-size:22px;font-weight:900;margin:2px 0 10px}.line{font-size:12px;line-height:1.65;color:#364139}.line b{display:inline-block;min-width:34px}.ticket{margin-top:10px;background:#f5f7f5;border-radius:11px;padding:10px;font-size:11px;font-weight:800;line-height:1.55}.result-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.result-details summary{font-size:11px;color:var(--muted);font-weight:900;cursor:pointer;list-style:none}.result-details summary::-webkit-details-marker{display:none}.result-details summary:after{content:'＋';float:right}.result-details[open] summary:after{content:'−'}.result{margin-top:10px;padding:11px;border-radius:12px;background:#f5f7f5}.result.hit{background:#e8f5ee}.result.miss{background:#fbefed}.result-top{display:flex;align-items:center;justify-content:space-between}.result-top b{font-size:14px}.hit .result-top b{color:var(--green)}.miss .result-top b{color:var(--red)}.result p{font-size:11px;line-height:1.55;margin:7px 0 0}.result-ranks{font-size:11px;line-height:1.6;margin-top:8px}.payout{font-size:11px;font-weight:900}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">予想ページ</a></header><main class="wrap"><section class="hero"><small>PRE-RACE ARCHIVE</small><h1>8/29・8/30<br>過去の事前予想</h1><p>発走前にどう見ていたかをそのまま残すページです。的中・不的中より、本命・相手・穴の考え方を先に表示します。</p></section><div class="notice">掲載基準は「結果」ではなく「事前の見立てが残っていること」。最低限、本命・中心馬や相手候補など発走前の考えが確認できるレースを掲載します。結果は確認用として折りたたんでいます。</div><div class="dates"><button class="active" data-date="ALL">両日</button><button data-date="2026-08-30">8/30</button><button data-date="2026-08-29">8/29</button></div><div id="list" class="list"></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let races=[],date='ALL';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function arr(v){return Array.isArray(v)?v:[]}function render(){const rows=races.filter(r=>date==='ALL'||r.date===date);$('#list').innerHTML=rows.map(r=>`<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${r.date.replaceAll('-','/')} · ${esc(r.surface||'')} ${r.distance_m?esc(r.distance_m)+'m':''}</small></div><span class="badge">${esc(r.type_label||'事前予想')}</span></div><section class="pre"><small>発走前の見立て</small><div class="axis-label">本命・中心</div><div class="axis">${esc(r.axis||'記録あり')}</div><div class="line"><b>相手</b> ${arr(r.partners).map(esc).join(' / ')||'記録なし'}</div><div class="line"><b>穴</b> ${arr(r.holes).map(esc).join(' / ')||'記録なし'}</div>${r.formation?`<div class="ticket">${esc(r.formation)}${r.ticket_count?`<br>${r.ticket_count}点`:''}</div>`:''}</section>${arr(r.result_top3).length?`<details class="result-details"><summary>結果を確認する</summary><div class="result ${r.hit?'hit':'miss'}"><div class="result-top"><b>${r.hit?'的中':'不的中'}</b>${r.hit&&r.return_amount?`<span class="payout">払戻 ${Number(r.return_amount).toLocaleString()}円</span>`:''}</div><div class="result-ranks">${arr(r.result_top3).map((x,i)=>`${i+1}着 ${esc(x)}`).join('<br>')}${r.trio_result?`<br>三連複 ${esc(r.trio_result)}${r.trio_payout?` ／ ${Number(r.trio_payout).toLocaleString()}円`:''}`:''}</div>${r.review?`<p>${esc(r.review)}</p>`:''}</div></details>`:''}</article>`).join('')||'<div class="empty">該当データなし</div>'}$$('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;$$('[data-date]').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('../data/replay-demo-2026-08-29-30.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{races=d.races||[];render()});</script></body></html>
