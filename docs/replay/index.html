<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>過去の事前予想｜JRA AI</title><meta name="robots" content="noindex,nofollow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#08704a;--red:#b63a31;--soft:#e9f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:74px}.top{height:54px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.96);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:860px;margin:auto;padding:18px 14px 30px}.hero small{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.1em}.hero h1{font-size:27px;margin:7px 0 8px}.hero p,.notice{font-size:12px;line-height:1.65;color:var(--muted)}.notice{margin:16px 0;background:#fff7df;border:1px solid #ecdcaa;border-radius:14px;padding:12px}.dates{display:flex;gap:8px;overflow:auto;margin:18px 0 12px}.dates button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.dates button.active{background:var(--ink);color:#fff}.count{font-size:10px;color:var(--muted);margin-bottom:10px}.list{display:grid;gap:10px}.race{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.head{display:flex;justify-content:space-between;gap:10px}.head b{font-size:17px}.head small{display:block;margin-top:4px;color:var(--muted);font-size:10px}.badge{font-size:10px;font-weight:900;background:var(--soft);color:var(--green);height:max-content;padding:5px 8px;border-radius:99px}.pre{margin-top:13px;border-top:1px solid var(--line);padding-top:12px}.pre>small{font-size:9px;color:var(--green);font-weight:900}.axis-label{font-size:10px;color:var(--muted);margin-top:8px}.axis{font-size:22px;font-weight:900;margin:2px 0 10px}.line{font-size:12px;line-height:1.65;color:#364139}.line b{display:inline-block;min-width:34px}.note{margin-top:8px;font-size:10px;line-height:1.55;color:var(--muted)}.result-details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.result-details summary{font-size:11px;color:var(--muted);font-weight:900;cursor:pointer}.result{margin-top:10px;padding:11px;border-radius:12px;background:#f5f7f5}.result.hit{background:#e8f5ee}.result.miss{background:#fbefed}.result.place{background:#fff7df}.result-top{display:flex;justify-content:space-between;gap:8px}.axis-result{margin-top:8px;font-size:17px;font-weight:900}.axis-pop{font-size:11px;font-weight:900;background:#fff;border:1px solid var(--line);padding:5px 8px;border-radius:999px}.empty{padding:30px;text-align:center;color:var(--muted)}.mobile-nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-decoration:none;color:#5d6862;text-align:center;font-size:10px;font-weight:900;padding:12px 2px}@media(min-width:760px){body{padding-bottom:0}.mobile-nav{display:none}.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">予想ページ</a></header><main class="wrap"><section class="hero"><small>PRE-RACE ARCHIVE</small><h1>過去の事前予想</h1><p>実際に発走前に提示した予想だけを残します。検証用の再生予想・結果遮断再構築はここには掲載しません。</p></section><div class="notice">◎＝軸馬1着、△＝軸馬2〜3着、×＝軸馬4着以下。人気は結果確認専用で、事前予想には使用していません。</div><div id="dates" class="dates"></div><div id="count" class="count"></div><div id="content"></div></main><nav class="mobile-nav"><a href="../">ホーム</a><a href="../app/">予想</a><a href="../horses/">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let races=[],axisResults=new Map(),date='ALL';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const arr=v=>Array.isArray(v)?v:[];const key=r=>`${r.date}|${r.track}|${Number(r.race_no||0)}`;function axisResultBlock(r){const a=axisResults.get(key(r));if(!a||!a.matched)return'';const cls=a.evaluation==='HIT'?'hit':a.evaluation==='PLACE'?'place':'miss';const pop=a.popularity?`${a.popularity}番人気`:'人気不明';return `<details class="result-details"><summary>結果を確認する</summary><div class="result ${cls}"><div class="result-top"><b>${esc(a.symbol)} ${esc(a.label)}</b><span class="axis-pop">軸 ${esc(pop)}</span></div><div class="axis-result">${esc(a.horse_name||a.axis_horse_name)} → ${a.finish?esc(a.finish)+'着':'着順不明'}</div></div></details>`}function card(r){return `<article class="race"><div class="head"><div><b>${esc(r.track)} ${r.race_no}R ${esc(r.race_name||'')}</b><small>${esc(r.date).replaceAll('-','/')}</small></div><span class="badge">${esc(r.type_label||'事前予想')}</span></div><section class="pre"><small>発走前の見立て</small><div class="axis-label">本命・中心</div><div class="axis">${esc(r.axis||'記録あり')}</div><div class="line"><b>相手</b> ${arr(r.partners).map(esc).join(' / ')||'記録なし'}</div><div class="line"><b>穴</b> ${arr(r.holes).map(esc).join(' / ')||'記録なし'}</div>${r.pre_note?`<div class="note">${esc(r.pre_note)}</div>`:''}</section>${axisResultBlock(r)}</article>`}function renderDates(){const ds=[...new Set(races.map(r=>r.date))].sort().reverse();$('#dates').innerHTML=`<button class="${date==='ALL'?'active':''}" data-date="ALL">すべて</button>`+ds.map(d=>`<button class="${date===d?'active':''}" data-date="${d}">${Number(d.slice(5,7))}/${Number(d.slice(8))}</button>`).join('');$$('[data-date]').forEach(b=>b.onclick=()=>{date=b.dataset.date;renderDates();render()})}function render(){const rows=races.filter(r=>date==='ALL'||r.date===date).sort((a,b)=>b.date.localeCompare(a.date)||(a.race_no||0)-(b.race_no||0));$('#count').textContent=`${rows.length}レース掲載`;$('#content').innerHTML=`<div class="list">${rows.map(card).join('')||'<div class="empty">実際の発走前予想ログはありません。</div>'}</div>`}Promise.all([fetch('../data/pre-race-actual-archive.json',{cache:'no-store'}).then(r=>r.json()),fetch('../data/replay-axis-results.json',{cache:'no-store'}).then(r=>r.ok?r.json():({rows:[]})).catch(()=>({rows:[]}))]).then(([d,a])=>{races=(d.races||[]).filter(r=>r.prediction_source==='PRE_RACE_CONVERSATION_LOG');axisResults=new Map((a.rows||[]).map(x=>[`${x.date}|${x.track}|${Number(x.race_no||0)}`,x]));renderDates();render()});</script></body></html>
