ng">えい・あーる・しー・あい</div><h1>ARCI</h1><p>組織</p></section><section class="term"><p class="summary" data-word-links-scope>Association of Racing Commissioners International（州競馬委員会全国協会）の略。ARCIの総会は米・加・メキシコ各州の競馬委員会委員が競馬の諸問題を全米的な視野で話し合う会合であるが、毎年、南米やアジア、ヨーロッパからもオブザーバー参加があって、重要な情報交換の場となっている。</p><p><a class="back" href="https://www.jra.go.jp/kouza/yougo/e_list.html" target="_blank" rel="noopener">出典：JRA公式 競馬用語辞典</a></p></section><a class="back" href="../">← ワード索引へ戻る</a></main><script src="/-jra-horse-bigdata-updater/word-links.js"></script></body></html>
