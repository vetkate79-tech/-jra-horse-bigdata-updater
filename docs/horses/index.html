<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JRA馬データ検索｜重賞経験馬・8/29-8/30全出走馬</title><meta name="description" content="JRAのG1・G2・G3出走経験馬と2026年8月29日・30日の中央競馬全出走馬を検索できる馬データページ。"><meta name="robots" content="index,follow"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#69756e;--line:#dce3de;--green:#0b7146;--soft:#e8f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;padding-bottom:70px}.top{position:sticky;top:0;z-index:20;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(244,246,243,.95);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:900px;margin:auto;padding:20px 14px}.title h1{font-size:28px;margin:0 0 5px}.title p{font-size:12px;color:var(--muted);margin:0}.search{position:relative;margin:18px 0 12px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 44px 14px 14px;font-size:16px;outline:none}.search span{position:absolute;right:15px;top:13px}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:8px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:11px;font-weight:900}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.count{font-size:11px;color:var(--muted);margin:8px 2px 12px}.list{display:grid;gap:8px}.horse{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;text-align:left;width:100%}.horse-top{display:flex;justify-content:space-between;gap:10px}.horse b{font-size:16px}.horse small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.tag{font-size:9px;padding:4px 6px;border-radius:999px;background:var(--soft);color:var(--green);font-weight:900}.arrow{font-size:20px;color:#8c9891}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.sheet{display:none;position:fixed;inset:0;z-index:50}.sheet.open{display:block}.shade{position:absolute;inset:0;background:rgba(7,14,10,.55)}.card{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;max-height:88dvh;overflow:auto;padding:10px 16px calc(26px + env(safe-area-inset-bottom))}.handle{width:38px;height:4px;background:#d3dad6;border-radius:99px;margin:2px auto 14px}.detail h2{font-size:24px;margin:0}.detail .meta{font-size:11px;color:var(--muted);margin:5px 0 14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:#f4f7f5;border-radius:10px;padding:10px}.stat small{display:block;color:var(--muted);font-size:9px}.stat b{font-size:15px}.section{border-top:1px solid var(--line);padding:14px 0}.section h3{font-size:12px;margin:0 0 8px}.race{padding:9px 0;border-top:1px solid #edf0ee;font-size:11px}.race:first-of-type{border-top:0}.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}.mobile-nav a{text-align:center;text-decoration:none;color:#59655e;font-size:10px;font-weight:900;padding:12px 2px}.mobile-nav a.active{color:var(--green)}@media(min-width:760px){.list{grid-template-columns:repeat(2,1fr)}.mobile-nav{display:none}body{padding-bottom:0}}</style></head><body><header class="top"><a href="../app/">JRA AI</a><a href="../consult/">相談</a></header><main class="wrap"><section class="title"><h1>馬データ</h1><p>馬名で検索。重賞経験馬と8/29・8/30出走馬をまとめています。</p></section><div class="search"><input id="q" type="search" placeholder="馬名を入力"><span>⌕</span></div><div class="tabs"><button class="active" data-tab="ALL">すべて</button><button data-tab="GRADED">G1〜G3経験</button><button data-tab="2026-08-30">8/30</button><button data-tab="2026-08-29">8/29</button></div><div id="count" class="count">読み込み中</div><div id="list" class="list"></div></main><div id="sheet" class="sheet"><div class="shade" data-close></div><section class="card"><div class="handle"></div><div id="detail" class="detail"></div></section></div><nav class="mobile-nav"><a href="../app/">予想</a><a href="../app/#history">履歴</a><a class="active" href="./">データ</a><a href="../consult/">相談</a></nav><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let horses=[],tab='ALL';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const pct=v=>v==null||v===''?'--':(Number(v)*100).toFixed(1)+'%';function match(h){const q=$('#q').value.trim();if(q&&!h.horse_name.includes(q))return false;if(tab==='GRADED'&&!h.graded_starts.length)return false;if(/^2026-/.test(tab)&&!h.target_starts.some(x=>x.date===tab))return false;return true}function render(){const rows=horses.filter(match);$('#count').textContent=`${rows.length.toLocaleString()}頭`;$('#list').innerHTML=rows.slice(0,500).map((h,i)=>`<button class="horse" data-name="${esc(h.horse_name)}"><div class="horse-top"><div><b>${esc(h.horse_name)}</b><small>${esc(h.sex_age||'')} ${h.trainer?'/ '+esc(h.trainer):''}</small></div><span class="arrow">›</span></div><div class="tags">${h.graded_experience.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}${h.target_starts.some(x=>x.date==='2026-08-30')?'<span class="tag">8/30出走</span>':''}${h.target_starts.some(x=>x.date==='2026-08-29')?'<span class="tag">8/29出走</span>':''}</div></button>`).join('')||'<div class="empty">該当する馬はいません</div>';$$('.horse').forEach(b=>b.onclick=()=>openHorse(b.dataset.name))}function openHorse(name){const h=horses.find(x=>x.horse_name===name);if(!h)return;const raceRows=[...h.target_starts,...h.graded_starts].sort((a,b)=>b.date.localeCompare(a.date));$('#detail').innerHTML=`<h2>${esc(h.horse_name)}</h2><div class="meta">${esc(h.sex_age||'')} ${h.trainer?'/ 調教師 '+esc(h.trainer):''}</div><div class="tags">${h.graded_experience.map(x=>`<span class="tag">${esc(x)}経験</span>`).join('')}</div><div class="stats"><div class="stat"><small>勝率</small><b>${pct(h.win_rate)}</b></div><div class="stat"><small>連対率</small><b>${pct(h.quinella_rate)}</b></div><div class="stat"><small>3着内率</small><b>${pct(h.show_rate)}</b></div></div><div class="section"><h3>登録済みレース</h3>${raceRows.map(r=>`<div class="race"><b>${esc(r.date)} ${esc(r.course)} ${esc(r.race_no)}R ${esc(r.race_name||'')}</b><br>${esc(r.surface)} ${esc(r.distance_m)}m / ${r.horse_no?'馬番 '+esc(r.horse_no):''} ${r.finish?' / '+esc(r.finish)+'着':''}</div>`).join('')||'履歴なし'}</div>`;$('#sheet').classList.add('open')}$('[data-close]').onclick=()=>$('#sheet').classList.remove('open');$('#q').oninput=render;$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});fetch('../data/horses/catalog.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{horses=d.horses||[];render()}).catch(()=>{$('#count').textContent='データ生成中';$('#list').innerHTML='<div class="empty">JRA公式データを取り込み中です。</div>'});</script></body></html>
