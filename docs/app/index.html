<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>気になる馬を選ぶ｜JRA AI</title><meta name="description" content="日付・競馬場・レースを選ぶと、そのレースの出走馬を確認できます。"><link rel="stylesheet" href="./race-select.css"><meta name="theme-color" content="#f7f4ef"></head><body><header class="top"><div class="topbar"><a class="brand" href="../">JRA AI</a><div><a class="toplink" href="../consult/">AIに聞く</a> <a class="toplink" href="../replay/">過去予想</a></div></div></header><main class="wrap"><section class="intro"><small>CHOOSE YOUR HORSE</small><h1>まずは、気になる馬を選ぶ。</h1><p>日付・競馬場・レースを選ぶと、そのレースに登録されている馬名だけを表示します。今は一本化と使用感の確認を優先しています。</p></section><section class="panel"><div class="panel-title"><b>日付</b><small>開催日</small></div><div id="dateSeg" class="seg"></div></section><section class="panel"><div class="panel-title"><b>競馬場</b><small>開催場</small></div><div id="trackSeg" class="seg"></div><div id="raceStrip" class="race-strip"></div></section><section class="panel"><div class="race-head"><h2 id="raceTitle">読み込み中</h2><p id="raceMeta"></p></div><div id="horses" class="horse-list"></div><div class="selection-summary"><small>気になる馬</small><b id="selectedCount">0頭</b><p id="selectedNames">気になる馬をタップしてください</p></div></section><p class="hint">この画面は <code>race_cards.json</code> だけを参照します。古いデモ馬リストや予想状態は使っていません。</p></main><a id="expertFloat" class="expert-float" href="../analysis/"><span class="expert-float-icon">∴</span><span><small>FREE OPEN</small><b>詳細分析</b></span><span class="expert-float-arrow">›</span></a><script src="./race-select.js"></script><script>document.getElementById('expertFloat').addEventListener('click',function(){const d=document.body.dataset;const p=new URLSearchParams();if(d.date)p.set('date',d.date);if(d.track)p.set('track',d.track);if(d.race)p.set('race',d.race);this.href='../analysis/'+(p.toString()?'?'+p.toString():'')});</script></body></html>
