<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>気になる馬を選ぶ｜JRA AI</title><meta name="description" content="日付・競馬場・レースを選ぶと、そのレースの出走馬を確認できます。"><link rel="stylesheet" href="./race-select.css"><meta name="theme-color" content="#f7f4ef"></head><body><header class="top"><div class="topbar"><a class="brand" href="../">JRA AI</a><div><a class="toplink" href="../consult/">AIに聞く</a> <a class="toplink" href="../replay/">8月検証</a></div></div></header><main class="wrap"><section class="intro"><small>CHOOSE YOUR HORSE</small><h1>まずは、気になる馬を選ぶ。</h1><p>日付・競馬場・レースを選ぶと、そのレースに登録されている馬名だけを表示します。予想生成時は常にリポジトリ上の最新正規モデルを参照します。</p><p id="modelStatus" style="font-size:11px;font-weight:800">最新モデル情報を読込中</p></section><section class="panel"><div class="panel-title"><b>日付</b><small>開催日</small></div><div id="dateSeg" class="seg"></div></section><section class="panel"><div class="panel-title"><b>競馬場</b><small>開催場</small></div><div id="trackSeg" class="seg"></div><div id="raceStrip" class="race-strip"></div></section><section class="panel"><div class="race-head"><h2 id="raceTitle">読み込み中</h2><p id="raceMeta"></p></div><div id="horses" class="horse-list"></div><div class="selection-summary"><small>気になる馬</small><b id="selectedCount">0頭</b><p id="selectedNames">気になる馬をタップしてください</p></div></section><p class="hint">この画面は <code>race_cards.json</code> を表示し、予想・詳細分析側は最新の封印済みモデル出力を参照します。旧検証モデルを固定表示しません。</p></main><a id="expertFloat" class="expert-float" href="../analysis/"><span class="expert-float-icon">∴</span><span><small>FREE OPEN</small><b>詳細分析</b></span><span class="expert-float-arrow">›</span></a><script src="./race-select.js"></script><script>document.getElementById('expertFloat').addEventListener('click',function(){const d=document.body.dataset;const p=new URLSearchParams();if(d.date)p.set('date',d.date);if(d.track)p.set('track',d.track);if(d.race)p.set('race',d.race);this.href='../analysis/'+(p.toString()?'?'+p.toString():'')});fetch('../data/current-model.json',{cache:'no-store'}).then(r=>r.json()).then(m=>{const t=m.optimization_targets||{};document.getElementById('modelStatus').textContent=`現在: ${m.operational_layer} + ${m.feature_layer} ｜ 軸3着内目標 ${t.axis_top3_rate_pct||70}% ｜ 上位3頭捕捉目標 ${t.top3_candidate_complete_capture_pct||75}%`}).catch(()=>{document.getElementById('modelStatus').textContent='最新モデルは予想生成時に自動参照します'});</script><script src="/-jra-horse-bigdata-updater/word-links.js"></script></body></html>
