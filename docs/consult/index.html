<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIに聞く｜JRA AI</title><meta name="description" content="選んだ馬券について、馬が絡む展開・最高到達順位・一緒に来る推奨馬をAIに相談。"><link rel="stylesheet" href="../enjoy-theme.css"><style>:root{--bg:#f6f3ed;--paper:#fffdf9;--ink:#162019;--muted:#737a74;--line:#e5e0d6;--green:#2f6e50;--soft:#edf5ef;--blue:#2f6fae;--cream:#fff4dc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf7f1,#f4f1ea);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:820px;margin:auto;padding:0 16px 90px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.top a{color:var(--ink);text-decoration:none;font-weight:900}.hero{padding:30px 0 20px}.hero small{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.12em}.hero h1{font-size:36px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.03em}.hero p{font-size:13px;color:var(--muted);line-height:1.8;margin:0}.ticket-context{display:none;background:var(--cream);border:1px solid #ead8ad;border-radius:18px;padding:14px;margin-bottom:12px}.ticket-context.show{display:block}.ticket-context small{font-size:9px;font-weight:900;color:#7a6032}.ticket-context b{display:block;font-size:17px;margin:5px 0}.ticket-context p{margin:0;font-size:11px;line-height:1.7;color:#655b48}.search{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:6px 7px 6px 15px;box-shadow:0 12px 32px rgba(58,49,39,.06)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:13px 0}.search button{border:0;background:var(--green);color:#fff;border-radius:13px;padding:12px 16px;font-weight:900}.quick{display:flex;gap:7px;overflow:auto;padding:12px 0}.quick button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;color:#465149}.answer{display:none;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:10px;box-shadow:0 14px 35px rgba(55,45,35,.06)}.answer.show{display:block}.answer small{color:var(--green);font-size:9px;font-weight:900;letter-spacing:.08em}.answer h2{font-size:20px;margin:7px 0 9px}.answer p{font-size:13px;line-height:1.85;color:#3b463e;margin:0}.ai-feature-link{display:inline-flex;margin-top:13px;background:var(--soft);color:var(--green);text-decoration:none;font-size:11px;font-weight:900;padding:9px 12px;border-radius:999px}.ai-consult-loading{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}.ai-consult-loading span{width:34px;height:34px;border-radius:50%;border:3px solid #dbe7df;border-top-color:var(--green);animation:spin .8s linear infinite}.ai-consult-loading small{color:var(--muted);font-size:10px;max-width:360px;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}.split{display:grid;gap:10px;margin-top:20px}.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink)}.card b{display:block;font-size:15px}.card p{margin:6px 0 0;font-size:11px;line-height:1.7;color:var(--muted)}.word-link b{color:var(--blue)}.principle{margin-top:18px;padding:14px 15px;border-radius:16px;background:#fbf5e9;color:#655b48;font-size:11px;line-height:1.75}.principle b{color:#3d493e}@media(min-width:700px){.hero h1{font-size:44px}.split{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><header class="top"><a href="../app/">← 馬券選択</a><a href="../words/">競馬ワード</a></header><section class="hero"><small>ASK JRA AI</small><h1 id="heroTitle">競馬のこと、<br>そのまま聞いて。</h1><p id="heroText">選んだ馬券からでも、自由な質問からでもAIに相談できます。</p></section><section id="ticketContext" class="ticket-context"></section><div class="search"><input id="q" placeholder="競馬について聞きたいことを入力"><button id="ask">AIに聞く</button></div><div class="quick"><button data-q="この馬が好走する展開を詳しく教えて">好走展開</button><button data-q="最高到達順位をどう見ている？">最高順位</button><button data-q="一緒に来る可能性が高い馬を教えて">推奨馬</button></div><section id="answer" class="answer"></section><section class="split"><a id="analysisLink" class="card" href="../analysis/"><b>玄人向け・詳細分析 →</b><p>能力評価、展開、軸耐久性、3着侵入、券種別考察を確認できます。</p></a><a class="card word-link" href="../words/"><b>言葉の意味は競馬ワードへ →</b><p>用語はその場で意味まで確認できます。</p></a></section><div class="principle"><b>この馬券相談の回答方針</b><br>選択馬が力を発揮する条件と成立シナリオを中心に、前向きな表現で整理します。8/30の実結果はこの事前分析には使いません。</div></main><script src="./ai-term-capture.js"></script><script src="../ai-consult-client.js"></script><script>const q=document.querySelector('#q'),ask=document.querySelector('#ask'),box=document.querySelector('#answer'),p=new URLSearchParams(location.search);const BET_LABEL={trio:'三連複',place:'複勝',wide:'ワイド',quinella:'馬連',win:'単勝',trifecta:'三連単'};const ticketMode=p.get('ticket_mode')==='1';const date=p.get('date')||'',track=p.get('track')||'',race=p.get('race')||'',bet=p.get('bet')||'',horses=(p.get('horses')||'').split(',').filter(Boolean),names=(p.get('horse_names')||'').split(',').filter(Boolean),raceName=p.get('race_name')||'';const analysis=new URL('../analysis/',location.href);['date','track','race','bet','horses'].forEach(k=>{const v=p.get(k);if(v)analysis.searchParams.set(k,v)});document.querySelector('#analysisLink').href=analysis.href;function ticketPrompt(extra=''){const picks=horses.map((n,i)=>`${n}番${names[i]?` ${names[i]}`:''}`).join('、');return `${date} ${track} ${race}R ${raceName}。${BET_LABEL[bet]||bet}で${picks}を選んでいます。実際のレース結果・払戻・人気・オッズは参照せず、事前情報だけで回答してください。選択した馬について、①その馬が絡む好走展開、②予想上の最高到達順位、③その展開で一緒に来る可能性が高い推奨馬を馬番と馬名で、の順に具体的に整理してください。複数の選択馬がいる場合は馬ごとに整理してください。「来ない」「無理」「消し」「危険」「おすすめしない」などの否定表現は使わず、成立条件・強み・相性の良い展開を前向きな表現だけで説明してください。${extra}`.trim()}function go(custom){const question=(custom||q.value).trim();if(!question)return;window.JRAAIConsult.ask({question,box,context:{surface:'ticket_consult',date,track,race,race_name:raceName,bet_type:bet,selected_horse_numbers:horses,selected_horse_names:names,pre_race_only:true,positive_scenario_only:true,requested_output:['好走展開','予想最高順位','推奨馬']}})}ask.onclick=()=>go(ticketMode?ticketPrompt(q.value?`追加質問：${q.value}`:''):q.value);q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ask.click()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;go(ticketMode?ticketPrompt(`重点質問：${b.dataset.q}`):b.dataset.q)});if(ticketMode){document.querySelector('#heroTitle').innerHTML='この馬券を、<br>AIと深掘り。';document.querySelector('#heroText').textContent='選択馬が力を発揮する展開、予想最高順位、一緒に走る推奨馬を事前情報だけで整理します。';const ctx=document.querySelector('#ticketContext');ctx.classList.add('show');ctx.innerHTML=`<small>SELECTED TICKET</small><b>${track} ${race}R ${raceName} ・ ${BET_LABEL[bet]||bet}</b><p>${horses.map((n,i)=>`${n}番 ${names[i]||''}`).join(' / ')}</p>`;q.value='この馬券を見て';go(ticketPrompt())}</script><script src="/-jra-horse-bigdata-updater/word-links.js"></script></body></html>
