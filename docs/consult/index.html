<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AIに聞く｜JRA AI</title><meta name="description" content="競馬の疑問をそのままAIに相談。分からないことは推測せず、使えるデータや見方まで案内します。"><link rel="stylesheet" href="../enjoy-theme.css"><style>:root{--bg:#f6f3ed;--paper:#fffdf9;--ink:#162019;--muted:#737a74;--line:#e5e0d6;--green:#2f6e50;--soft:#edf5ef;--blue:#2f6fae}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#faf7f1,#f4f1ea);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:820px;margin:auto;padding:0 16px 90px}.top{height:58px;display:flex;align-items:center;justify-content:space-between}.top a{color:var(--ink);text-decoration:none;font-weight:900}.hero{padding:30px 0 20px}.hero small{color:var(--green);font-size:10px;font-weight:900;letter-spacing:.12em}.hero h1{font-size:36px;line-height:1.15;margin:8px 0 12px;letter-spacing:-.03em}.hero p{font-size:13px;color:var(--muted);line-height:1.8;margin:0}.search{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:6px 7px 6px 15px;box-shadow:0 12px 32px rgba(58,49,39,.06)}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:13px 0}.search button{border:0;background:var(--green);color:#fff;border-radius:13px;padding:12px 16px;font-weight:900}.quick{display:flex;gap:7px;overflow:auto;padding:12px 0}.quick button{white-space:nowrap;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;color:#465149}.answer{display:none;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:10px;box-shadow:0 14px 35px rgba(55,45,35,.06)}.answer.show{display:block}.answer small{color:var(--green);font-size:9px;font-weight:900;letter-spacing:.08em}.answer h2{font-size:20px;margin:7px 0 9px}.answer p{font-size:13px;line-height:1.85;color:#3b463e;margin:0}.ai-feature-link{display:inline-flex;margin-top:13px;background:var(--soft);color:var(--green);text-decoration:none;font-size:11px;font-weight:900;padding:9px 12px;border-radius:999px}.ai-consult-loading{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}.ai-consult-loading span{width:34px;height:34px;border-radius:50%;border:3px solid #dbe7df;border-top-color:var(--green);animation:spin .8s linear infinite}.ai-consult-loading small{color:var(--muted);font-size:10px;max-width:360px;line-height:1.6}@keyframes spin{to{transform:rotate(360deg)}}.split{display:grid;gap:10px;margin-top:20px}.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;text-decoration:none;color:var(--ink)}.card b{display:block;font-size:15px}.card p{margin:6px 0 0;font-size:11px;line-height:1.7;color:var(--muted)}.word-link b{color:var(--blue)}.principle{margin-top:18px;padding:14px 15px;border-radius:16px;background:#fbf5e9;color:#655b48;font-size:11px;line-height:1.75}.principle b{color:#3d493e}@media(min-width:700px){.hero h1{font-size:44px}.split{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><header class="top"><a href="../">JRA AI</a><a href="../words/">競馬ワード</a></header><section class="hero"><small>ASK JRA AI</small><h1>競馬のこと、<br>そのまま聞いて。</h1><p>用語の意味を調べる場所ではなく、競馬について相談する場所です。「この馬ってどんな馬？」「こういう馬が好き」「この買い方どう？」のように、普段の言葉でそのまま聞けます。</p></section><div class="search"><input id="q" placeholder="例：前から行く馬が好き。今週そういう馬いる？"><button id="ask">AIに聞く</button></div><div class="quick"><button data-q="差し馬が好きなんだけど、どういうレースを見ると楽しい？">好きな脚質から探す</button><button data-q="このレースで軸が飛ぶとしたらどんな展開？">軸が飛ぶ展開</button><button data-q="単勝で選んだ馬から他の馬券も考えたい">買い目相談</button><button data-q="名前や走り方から好きな馬を見つけたい">馬を探す</button></div><section id="answer" class="answer"></section><section class="split"><a class="card" href="../horses/"><b>馬データを見る →</b><p>登録馬から名前・脚質・クラスなどを探せます。</p></a><a class="card word-link" href="../words/"><b>言葉の意味は競馬ワードへ →</b><p>用語はAIに聞かなくても、その場で意味まで確認できます。</p></a></section><div class="principle"><b>AI回答のルール</b><br>確認できない馬名・確率・オッズ・調教などを作りません。必要なデータが無ければ、何が足りないかをそのまま伝えます。</div></main><script src="./ai-term-capture.js"></script><script src="../ai-consult-client.js"></script><script>const q=document.querySelector('#q'),ask=document.querySelector('#ask'),box=document.querySelector('#answer');function go(){const question=q.value.trim();if(!question)return;window.JRAAIConsult.ask({question,box,context:{surface:'consult',source:'free_text'}})}ask.onclick=go;q.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;go()});</script><script src="/-jra-horse-bigdata-updater/word-links.js"></script></body></html>
