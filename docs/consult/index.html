<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>競馬の質問・ワード検索｜JRA AI</title><meta name="description" content="競馬の質問と専門用語検索をひとつの相談ページに統合。文章のまま質問でき、登録済み用語はクリックして意味を確認できます。"><link rel="canonical" href="https://vetkate79-tech.github.io/-jra-horse-bigdata-updater/consult/"><link rel="stylesheet" href="../enjoy-theme.css"><style>:root{--bg:#f4f6f3;--paper:#fff;--ink:#101814;--muted:#68746d;--line:#dce3de;--green:#0b7146;--soft:#e8f4ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:820px;margin:auto;padding:0 16px 90px}.top{height:54px;display:flex;align-items:center;justify-content:space-between}.top a{color:var(--ink);text-decoration:none;font-weight:900}.hero{padding:22px 0 16px}.hero small{color:var(--green);font-size:10px;font-weight:900}.hero h1{font-size:31px;line-height:1.18;margin:7px 0 9px}.hero p{font-size:13px;color:var(--muted);line-height:1.7}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;background:#e9eeea;padding:4px;border-radius:14px;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:900;color:var(--muted)}.tabs button.on{background:#fff;color:var(--ink)}.pane{display:none}.pane.on{display:block}.search{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px 5px 4px 12px}.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:10px 0}.search button{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:11px 13px;font-weight:900}.quick{display:flex;gap:7px;overflow:auto;padding:10px 0}.quick button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px}.answer{display:none;background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-top:10px}.answer.show{display:block}.answer small{color:var(--green);font-weight:900}.answer h2{font-size:20px;margin:6px 0 8px}.answer p{font-size:13px;line-height:1.8;color:#344039}.smart-term{border:0;background:var(--soft);color:var(--green);border-radius:6px;padding:2px 5px;font:inherit;font-weight:900;text-decoration:underline;text-underline-offset:2px}.smart-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.smart-chips .smart-term{border-radius:999px;padding:7px 10px;font-size:10px;text-decoration:none}.smart-source{font-size:10px!important;color:var(--muted)!important}.smart-back{border:0;background:var(--soft);color:var(--green);border-radius:999px;padding:8px 11px;font-weight:900}.word-search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 16px;font-size:15px}.word-count{font-size:10px;color:var(--muted);margin:8px 2px}.word-list{display:grid;gap:9px}.term{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer}.term h2{font-size:18px;margin:0}.term p{font-size:12px;line-height:1.7;color:#344039}.reading{font-size:9px;color:var(--muted)}.tag{font-size:9px;color:var(--green);background:var(--soft);padding:5px 8px;border-radius:99px}.term-head{display:flex;justify-content:space-between;gap:10px}.source{font-size:9px;color:var(--muted);text-decoration:none}.notice{margin-top:20px;padding:13px;background:var(--soft);border-radius:13px;font-size:11px;line-height:1.6;color:#355344}@media(min-width:760px){.word-list{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><header class="top"><a href="../app/">JRA AI</a><a href="../app/">馬を選ぶ</a></header><section class="hero"><small>ENJOY HORSE RACING</small><h1>分からないままでも、<br>聞いて大丈夫。</h1><p>「名前がかわいい馬いる？」「差し馬って何？」「この馬ってどんな走り方？」みたいな聞き方でOK。競馬に詳しくなくても、自分なりに馬を選ぶための手助けをします。</p></section><div class="tabs"><button class="on" data-pane="askPane">そのまま聞く</button><button data-pane="wordPane">競馬ワード</button></div><section id="askPane" class="pane on"><div class="search"><input id="q" placeholder="例：前から行く馬が好きなんだけど、何て言うの？"><button id="ask">聞く</button></div><div class="quick"><button data-q="差し馬ってどういう馬？">差し馬</button><button data-q="前残りになりそうってどういう意味？">前残り</button><button data-q="ハイペースだと差し馬が有利なの？">展開</button><button data-q="新馬戦は何を見るの？">新馬戦</button></div><section id="answer" class="answer"></section></section><section id="wordPane" class="pane"><div class="word-search"><input id="wordQ" type="search" placeholder="例：差し、上がり、ハイペース"></div><div id="wordCount" class="word-count"></div><div id="wordList" class="word-list"></div></section><p class="notice">難しい言葉を覚えるためのページではなく、「今ちょっと気になった」をその場で解決するための相談窓口です。登録済み用語はJRA公式などを優先して短く要約しています。</p></main><script>let terms=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function showPane(id){document.querySelectorAll('.pane').forEach(x=>x.classList.toggle('on',x.id===id));document.querySelectorAll('[data-pane]').forEach(x=>x.classList.toggle('on',x.dataset.pane===id))}function renderWords(){const q=document.querySelector('#wordQ').value.trim().toLowerCase();const rows=terms.filter(x=>[x.term,x.reading,x.category,x.summary].join(' ').toLowerCase().includes(q));document.querySelector('#wordCount').textContent=`${rows.length}語`;document.querySelector('#wordList').innerHTML=rows.map(x=>`<article class="term" data-term-card="${esc(x.term)}"><div class="term-head"><div><h2>${esc(x.term)}</h2><span class="reading">${esc(x.reading||'')}</span></div><span class="tag">${esc(x.category||'競馬用語')}</span></div><p>${esc(x.summary)}</p><a class="source" href="${esc(x.source_url)}" target="_blank" rel="noopener">出典：${esc(x.source_name)}</a></article>`).join('');document.querySelectorAll('[data-term-card]').forEach(x=>x.onclick=()=>{showPane('askPane');document.querySelector('#q').value=`${x.dataset.termCard}ってどういう意味？`;setTimeout(()=>document.querySelector('#ask').click(),0)})}document.querySelectorAll('[data-pane]').forEach(b=>b.onclick=()=>showPane(b.dataset.pane));document.querySelector('#wordQ').addEventListener('input',renderWords);document.querySelector('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#ask').click()}});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.querySelector('#q').value=b.dataset.q;document.querySelector('#ask').click()});fetch('../data/glossary.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{terms=d.terms||[];renderWords()});</script><script src="./smart-consult.js"></script></body></html>
