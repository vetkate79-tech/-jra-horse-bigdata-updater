<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>競馬ワード検索｜JRA AI</title><style>:root{--bg:#f3f5f3;--card:#fff;--ink:#101713;--muted:#6d7771;--line:#dce2de;--green:#0b7149;--soft:#edf6f1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.top a{text-decoration:none;color:var(--ink);font-weight:900}.wrap{max-width:820px;margin:auto;padding:24px 14px 40px}.eyebrow{font-size:10px;color:var(--green);font-weight:900;letter-spacing:.12em}.hero h1{font-size:30px;margin:6px 0 8px}.hero p{margin:0;color:var(--muted);font-size:12px;line-height:1.7}.search{position:sticky;top:68px;z-index:8;margin:18px 0 12px;background:rgba(243,245,243,.94);backdrop-filter:blur(10px);padding:4px 0}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 16px;font-size:15px;outline:none}.count{font-size:10px;color:var(--muted);margin:8px 2px}.list{display:grid;gap:9px}.term{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.term-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.term h2{font-size:18px;margin:0}.term .reading{display:block;font-size:9px;color:var(--muted);margin-top:3px}.tag{font-size:9px;font-weight:900;color:var(--green);background:var(--soft);padding:5px 8px;border-radius:99px;white-space:nowrap}.term p{font-size:12px;line-height:1.7;margin:11px 0 0;color:#344039}.source{display:block;margin-top:10px;font-size:9px;color:var(--muted);text-decoration:none}.empty{text-align:center;color:var(--muted);padding:36px}.note{margin-top:20px;padding:12px;border-radius:12px;background:#fff7df;font-size:10px;line-height:1.6;color:#655d43}@media(min-width:720px){.list{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a href="../">JRA AI</a><a href="../app/">AI答え合わせ</a></header><main class="wrap"><section class="hero"><span class="eyebrow">HORSE RACING WORDS</span><h1>競馬ワード検索</h1><p>AI答え合わせや予想画面に出てくる専門用語を、短くわかりやすく確認できます。</p></section><div class="search"><input id="q" type="search" placeholder="例：差し、上がり、ハイペース"></div><div id="count" class="count"></div><div id="list" class="list"></div><div class="note">用語説明はJRA公式を優先し、必要に応じて競馬メディアの実戦向け説明を補助的に参照しています。外部文章はそのまま転載せず要約しています。</div></main><script>let terms=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function render(){const q=document.querySelector('#q').value.trim().toLowerCase();const rows=terms.filter(x=>[x.term,x.reading,x.category,x.summary].join(' ').toLowerCase().includes(q));document.querySelector('#count').textContent=`${rows.length}語`;document.querySelector('#list').innerHTML=rows.map(x=>`<article class="term" id="${encodeURIComponent(x.term)}"><div class="term-head"><div><h2>${esc(x.term)}</h2><span class="reading">${esc(x.reading||'')}</span></div><span class="tag">${esc(x.category||'競馬用語')}</span></div><p>${esc(x.summary)}</p><a class="source" href="${esc(x.source_url)}" target="_blank" rel="noopener">出典：${esc(x.source_name)} ↗</a></article>`).join('')||'<div class="empty">該当する用語がありません</div>'}fetch('../data/glossary.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{terms=d.terms||[];const p=new URLSearchParams(location.search).get('q');if(p)document.querySelector('#q').value=p;render()});document.querySelector('#q').addEventListener('input',render);</script></body></html>
