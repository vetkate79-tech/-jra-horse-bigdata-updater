name: Build public horse catalog

on:
  push:
    branches: [main]
    paths:
      - 'src/build_public_horse_catalog.py'
      - 'src/build_public_race_cards.py'
      - 'src/collect_jra_target_dates.py'
      - '.github/workflows/build-public-horse-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-horse-catalog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect Aug 29-30 JRA official HTML results
        env:
          TARGET_YEAR: '2026'
          TARGET_DATES: '2026-08-29,2026-08-30'
          JRA_MONTH_SEED: 'pw01skl10202608/E1'
        run: python src/collect_jra_target_dates.py
      - name: Build public catalog
        run: python src/build_public_horse_catalog.py
      - name: Build verified race cards
        run: python src/build_public_race_cards.py
      - name: Commit generated horse and race data
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/race_results_html_2026_weekend.csv data/race_payouts_2026_weekend.csv data/race_context_2026_weekend.csv status/html_collection_2026_weekend.json docs/data/horses docs/data/race_cards.json || true
          git diff --cached --quiet || git commit -m 'data: publish verified Aug 29-30 race cards'
          git pull --rebase origin main
          git push
