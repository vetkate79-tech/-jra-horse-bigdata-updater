name: Run oral v8 full-style 72 sealed replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/build_oral_v8_72_fullstyle.py'
      - 'docs/data/pretarget-corner-cache.json'
      - '.github/workflows/run-oral-v8-72-fullstyle.yml'
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build sealed V8 predictions
        run: python src/build_oral_v8_72_fullstyle.py
      - name: Verify prediction seal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/oral-v8-72-fullstyle-predictions-sealed.json').read_text())
          assert d['race_count']==72
          assert d['result_data_used'] is False
          assert d['odds_popularity_used'] is False
          assert d['post_target_running_style_used'] is False
          assert d['corner_cache_cutoff']=='2026-08-29'
          print({'hash':d['prediction_hash_sha256'],'resolved':d['role_style_assignments_resolved'],'unknown':d['role_style_assignments_unknown']})
          PY
      - name: Score after seal
        run: |
          cp docs/data/oral-v8-72-fullstyle-predictions-sealed.json docs/data/oral-v7-72-style-predictions-sealed.json.tmp
          python - <<'PY'
          from pathlib import Path
          p=Path('src/score_oral_v7_72_style_replay.py')
          s=p.read_text().replace("oral-v7-72-style-predictions-sealed.json","oral-v8-72-fullstyle-predictions-sealed.json").replace("oral-v7-72-style-scored.json","oral-v8-72-fullstyle-scored.json").replace("oral-v7-72-style-scored.json","oral-v8-72-fullstyle-scored.json")
          Path('/tmp/scorev8.py').write_text(s)
          PY
          python /tmp/scorev8.py
      - name: Compare V8 vs V7
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v8=json.loads(Path('docs/data/oral-v8-72-fullstyle-scored.json').read_text())['summary']
          v7=json.loads(Path('docs/data/oral-v7-72-style-scored.json').read_text())['summary']
          v8['vs_v7']={
            'axis_1st_delta':v8['axis_1st']-v7['axis_1st'],
            'axis_top3_delta':(v8['axis_1st']+v8['axis_2nd_3rd'])-(v7['axis_1st']+v7['axis_2nd_3rd']),
            'trio_hits_delta':v8['trio_hits']-v7['trio_hits'],
            'trio_hit_rate_delta_pct_points':round(v8['trio_hit_rate_pct']-v7['trio_hit_rate_pct'],2)
          }
          Path('status/oral-v8-72-fullstyle-scored.json').write_text(json.dumps(v8,ensure_ascii=False,indent=2))
          print(json.dumps(v8,ensure_ascii=False,indent=2))
          PY
      - name: Commit V8 artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/oral-v8-72-fullstyle-predictions-sealed.json docs/data/oral-v8-72-fullstyle-scored.json status/oral-v8-72-fullstyle-predictions-sealed.json status/oral-v8-72-fullstyle-scored.json
          git diff --cached --quiet && exit 0
          git commit -m 'Run V8 full pre-target style sealed replay'
          git pull --rebase origin main
          git push origin HEAD:main
