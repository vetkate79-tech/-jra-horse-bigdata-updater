name: Build word dictionary and global links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.html'
      - 'docs/**/*.js'
      - 'docs/data/glossary.json'
      - 'docs/data/site-terms.json'
      - 'docs/data/site-terms-extra.json'
      - 'src/build_site_term_candidates.py'
      - 'src/build_word_dictionary_pages.py'
      - 'src/inject_global_word_links.py'
      - 'docs/word-links.js'
      - '.github/workflows/build-word-dictionary.yml'
  schedule:
    - cron: '40 18 * * *'

permissions:
  contents: write

concurrency:
  group: site-dictionary-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit uncovered site terminology
        run: python src/build_site_term_candidates.py
      - name: Build only curated self-contained dictionary pages
        run: python src/build_word_dictionary_pages.py
      - name: Inject global word linker
        run: python src/inject_global_word_links.py
      - name: Commit terminology and public site updates together
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A docs/ status/site_term_coverage.json
          git diff --cached --quiet && exit 0
          git commit -m 'site: audit terms and publish dictionary in one pass'
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
