name: V1.3 shadow regression
on:
  push:
    paths:
      - '.github/workflows/evaluate-v13-shadow.yml'
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate V1.3 without market/result leakage
        run: python src/evaluate_oral_v13_regression.py
      - name: Commit regression status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-v13-regression.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'validation: record V1.3 cross-week regression'
          git pull --rebase origin main
          git push
