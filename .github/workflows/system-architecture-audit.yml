name: System architecture audit

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - 'config/system_architecture.json'
      - 'src/audit_system_architecture.py'
      - 'src/build_management_erp.py'
      - 'src/build_live_sealed_predictions.py'
      - 'src/score_live_sealed_predictions.py'
      - 'src/build_live_pdca.py'
      - 'src/expire_weekly_runner_details.py'
      - 'src/collect_current_market_odds.py'
      - 'src/build_replay_page.py'
      - 'docs/admin/app.js'
      - 'docs/admin/index.html'
      - 'docs/admin/styles.css'
      - 'src/collect_upcoming_runner_details.py'
      - 'src/build_race_week_pre_race_features.py'
      - 'docs/app/race-select-current.js'
      - 'docs/analysis/index.html'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: architecture-audit
  cancel-in-progress: true

jobs:
  monitor:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Inspect latest formal prediction seal run (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ['GH_REPO']
          url = f'https://api.github.com/repos/{repo}/actions/workflows/race-week-prediction-seal.yml/runs?per_page=10'
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              runs = json.load(response).get('workflow_runs', [])
          if not runs:
              raise SystemExit('BLOCKED: no formal seal workflow runs found')
          latest = runs[0]
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          lines = [f"Latest seal run: {latest['html_url']}", f"Status: {latest['status']}", f"Conclusion: {latest.get('conclusion')}", f"Commit: {latest['head_sha']}"]
          print('\n'.join(lines))
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write('## 10-minute JRA seal monitor\n\n' + '\n\n'.join(lines) + '\n')
          if latest['status'] == 'completed' and latest.get('conclusion') not in ('success',):
              raise SystemExit('BLOCKED: formal seal failed; inspect logs before any safe rerun. Never overwrite sealed predictions.')
          PY
  audit:
    # The ten-minute scheduled monitor must never write architecture status or compete with live seals.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Guard advanced analysis race resolution
        run: |
          test -f docs/analysis/index.html
          grep -q "const findRace=" docs/analysis/index.html
          grep -q "function showState" docs/analysis/index.html
          ! grep -q "throw Error('選択したレース情報が見つかりません')" docs/analysis/index.html
          echo "ADVANCED_ANALYSIS_RESOLVER_OK"
      - name: Audit canonical flow and independent subsystems
        id: audit
        continue-on-error: true
        run: python src/audit_system_architecture.py
      - name: Commit architecture status even when blocked
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/system_architecture.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: update system architecture status'
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
      - name: Enforce clean architecture
        if: steps.audit.outcome != 'success'
        run: exit 1
