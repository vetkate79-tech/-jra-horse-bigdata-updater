name: Archive final diagnostic workflow leftovers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-final-diagnostics.yml']
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Move diagnostic leftovers out of active Actions
        run: |
          mkdir -p .github/workflow-archive
          for f in \
            diagnose-v10-failure-groups.yml \
            diagnose-v12-v6-axis.yml \
            diagnose-v9-failure-groups.yml \
            inspect-2025-rolling-source.yml \
            inspect-target-race-class-fields.yml; do
            test ! -f ".github/workflows/$f" || mv ".github/workflows/$f" ".github/workflow-archive/$f"
          done
          mv .github/workflows/archive-final-diagnostics.yml .github/workflow-archive/archive-final-diagnostics.yml
      - name: Commit final cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github
          git commit -m 'chore: archive remaining diagnostic workflows'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
