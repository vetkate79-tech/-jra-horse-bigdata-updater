name: Register upcoming JRA debut horses and race-week details

on:
  schedule:
    # JRA official race-card publication timing (JST):
    # Thu 16:00 = Sat/Sun cards without horse numbers
    # Fri 10:00 = Sat cards with horse numbers
    # Sat 10:00 = Sun cards with horse numbers
    # Fetch just after publication, then retry shortly after in case posting is delayed.
    - cron: '5 7 * * 4'   # Thu 16:05 JST
    - cron: '20 7 * * 4'  # Thu 16:20 JST retry
    - cron: '5 1 * * 5'   # Fri 10:05 JST
    - cron: '20 1 * * 5'  # Fri 10:20 JST retry
    - cron: '5 1 * * 6'   # Sat 10:05 JST
    - cron: '20 1 * * 6'  # Sat 10:20 JST retry
    - cron: '5 15 * * 6'  # Sun 00:05 JST: drop completed Saturday rows
    - cron: '5 15 * * 0'  # Mon 00:05 JST: archive completed Sunday rows and refresh active set
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect_upcoming_new_horses.py'
      - 'src/enrich_new_horse_entries.py'
      - 'src/collect_upcoming_runner_details.py'
      - 'src/build_race_week_pre_race_features.py'
      - 'src/build_horse_base_catalog.py'
      - 'src/check_horse_master_completion.py'
      - 'src/audit_horse_master_uniqueness.py'
      - '.github/workflows/register-upcoming-new-horses.yml'

permissions:
  contents: write

concurrency:
  group: horse-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore JRA horse profile cache
        uses: actions/cache@v4
        with:
          path: cache/jra_horse_profiles
          key: jra-new-horse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jra-new-horse-${{ runner.os }}-
            jra-profile-incremental-${{ runner.os }}-
      - name: Register debut horses from verified JRA cards
        run: python src/collect_upcoming_new_horses.py
      - name: Enrich only registered debut horses
        run: python src/enrich_new_horse_entries.py
      - name: Expand details only for this week's runners
        run: python src/collect_upcoming_runner_details.py
      - name: Verify race-week collection integrity
        run: |
          python - <<'PY'
          import json
          s=json.load(open('status/weekly_runner_details.json',encoding='utf-8'))
          assert s.get('status')=='READY'
          assert int(s.get('runner_count') or 0)>0
          assert int(s.get('frame_known_count') or 0)+int(s.get('frame_pending_count') or 0)==int(s.get('runner_count') or 0)
          assert int(s.get('missing_master_count') or 0)==0
          print(json.dumps({k:s.get(k) for k in ('race_count','runner_count','frame_known_count','frame_pending_count')},ensure_ascii=False))
          PY
      - name: Build leakage-safe race-week pre-race features
        run: python src/build_race_week_pre_race_features.py
      - name: Build lightweight public horse master
        run: python src/build_horse_base_catalog.py
      - name: Check horse master completion
        run: python src/check_horse_master_completion.py
      - name: Enforce horse identity uniqueness
        run: python src/audit_horse_master_uniqueness.py
      - name: Commit race-week horse data
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/horses/catalog.json docs/data/horses/base_catalog.json docs/data/horses/weekly_runner_details.json docs/data/horses/pre_race_features.json docs/data/horses/weekly_runner_history docs/data/horses/pre_race_feature_history docs/data/upcoming_new_horses.json status/upcoming_new_horses.json status/weekly_runner_details.json status/pre_race_features.json status/horse_master_completion.json status/horse_identity_uniqueness.json
          git diff --cached --quiet || git commit -m 'data: refresh race-week runners'
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race detected; retry $i/5"
            sleep $((i*5))
          done
          exit 1
