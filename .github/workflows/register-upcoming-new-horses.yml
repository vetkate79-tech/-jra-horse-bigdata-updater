name: Register upcoming JRA debut horses and race-week details

on:
  schedule:
    # Thursday 16:30 / 19:30 JST, Friday 09:30 JST, Saturday 07:30 JST.
    - cron: '30 7 * * 4'
    - cron: '30 10 * * 4'
    - cron: '30 0 * * 5'
    - cron: '30 22 * * 5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect_upcoming_new_horses.py'
      - 'src/enrich_new_horse_entries.py'
      - 'src/collect_upcoming_runner_details.py'
      - 'src/build_race_week_pre_race_features.py'
      - 'src/build_horse_base_catalog.py'
      - 'src/check_horse_master_completion.py'
      - '.github/workflows/register-upcoming-new-horses.yml'

permissions:
  contents: write

concurrency:
  group: horse-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore JRA horse profile cache
        uses: actions/cache@v4
        with:
          path: cache/jra_horse_profiles
          key: jra-new-horse-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jra-new-horse-${{ runner.os }}-
            jra-profile-incremental-${{ runner.os }}-
      - name: Register debut horses from verified JRA cards
        run: python src/collect_upcoming_new_horses.py
      - name: Enrich only registered debut horses
        run: python src/enrich_new_horse_entries.py
      - name: Expand details only for this week's runners
        run: python src/collect_upcoming_runner_details.py
      - name: Build leakage-safe race-week pre-race features
        run: python src/build_race_week_pre_race_features.py
      - name: Build lightweight public horse master
        run: python src/build_horse_base_catalog.py
      - name: Check horse master completion
        run: python src/check_horse_master_completion.py
      - name: Commit race-week horse data
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/horses/catalog.json docs/data/horses/base_catalog.json docs/data/horses/weekly_runner_details.json docs/data/horses/pre_race_features.json docs/data/upcoming_new_horses.json status/upcoming_new_horses.json status/weekly_runner_details.json status/pre_race_features.json status/horse_master_completion.json
          git diff --cached --quiet || git commit -m 'data: refresh lightweight master and race-week runner details'
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race detected; retry $i/5"
            sleep $((i*5))
          done
          exit 1
