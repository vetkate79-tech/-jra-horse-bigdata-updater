name: Calibrate replay v0.3

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/calibrate_replay_v03.py'
      - '.github/workflows/calibrate-replay-v03.yml'

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calibrate on Aug 29 and validate on Aug 30
        run: python src/calibrate_replay_v03.py
      - name: Commit calibration output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/model-calibration-v03.json status/model-calibration-v03.json
          git diff --cached --quiet && exit 0
          git commit -m 'Calibrate v0.3 on Aug 29 with Aug 30 holdout'
          git pull --rebase origin main
          git push origin HEAD:main
