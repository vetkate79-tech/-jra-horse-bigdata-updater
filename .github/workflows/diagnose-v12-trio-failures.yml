name: Diagnose V12 trio failures
on:
  push:
    paths:
      - 'src/diagnose_v12_trio_failures.py'
      - '.github/workflows/diagnose-v12-trio-failures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/diagnose_v12_trio_failures.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-v12-trio-failure-diagnostic.json
          git diff --cached --quiet && exit 0
          git commit -m 'Store V12 trio failure diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
