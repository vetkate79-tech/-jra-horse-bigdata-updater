name: Backfill 2025 JRA HTML histories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-2025-html.yml"

permissions:
  contents: write

concurrency:
  group: jra-html-backfill-2025
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect every 2025 structured result
        env:
          TARGET_YEAR: "2025"
          JRA_MONTH_SEED: "pw01skl10202508/E1"
        run: python src/collect_jra_html_results.py
      - name: Build and validate all-horse profiles
        run: python src/build_html_horse_profiles.py
      - name: Commit verified histories
        run: |
          git config user.name "jra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data status
          git diff --cached --quiet || git commit -m "data: backfill verified 2025 JRA HTML histories"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: jra-html-backfill-2025-${{ github.run_number }}
          path: |
            data/
            status/
          retention-days: 30
