name: Post JRA meeting data update

on:
  schedule:
    # 19:30 / 21:30 JST every day. No JRA meeting => safe no-op.
    - cron: '30 10 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect_jra_recent_completed.py'
      - 'src/merge_latest_results_into_catalog.py'
      - 'src/update_recent_runner_elite.py'
      - 'src/merge_active_elite_into_catalog.py'
      - 'src/expand_horse_categories.py'
      - 'src/check_horse_master_completion.py'
      - '.github/workflows/post-jra-meeting-update.yml'

permissions:
  contents: write

concurrency:
  group: horse-data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore JRA horse profile cache
        uses: actions/cache@v4
        with:
          path: cache/jra_horse_profiles
          key: jra-profile-incremental-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jra-profile-incremental-${{ runner.os }}-
            jra-horse-profiles-${{ runner.os }}-v1-
      - name: Discover and collect recently completed central meetings
        env:
          LOOKBACK_DAYS: '4'
          DISCOVERY_MAX_PAGES: '180'
        run: python src/collect_jra_recent_completed.py
      - name: Check whether a completed meeting was found
        id: state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s=json.load(open('status/jra_post_meeting_update.json',encoding='utf-8'))
          print('updated='+('true' if s.get('status')=='UPDATED' else 'false'))
          print('dates='+','.join(s.get('complete_dates',[])))
          PY
      - name: Merge latest runners into public horse master
        if: steps.state.outputs.updated == 'true'
        run: python src/merge_latest_results_into_catalog.py
      - name: Refresh graded/open status for recent runners
        if: steps.state.outputs.updated == 'true'
        run: python src/update_recent_runner_elite.py
      - name: Merge graded/open horses into public catalog
        if: steps.state.outputs.updated == 'true'
        run: python src/merge_active_elite_into_catalog.py
      - name: Expand lower class categories from verified JRA races
        if: steps.state.outputs.updated == 'true'
        run: python src/expand_horse_categories.py
      - name: Check horse master completion
        if: steps.state.outputs.updated == 'true'
        run: python src/check_horse_master_completion.py
      - name: Commit automatic central-meeting update
        if: steps.state.outputs.updated == 'true'
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/race_results_html_2026.csv data/race_payouts_2026.csv data/race_context_2026.csv status/jra_post_meeting_update.json status/horse_master_completion.json docs/data/horses/catalog.json docs/data/horses/active_graded.json docs/data/horses/active_open.json docs/data/horses/active_elite.json || true
          git diff --cached --quiet || git commit -m "data: auto update completed JRA meeting ${{ steps.state.outputs.dates }}"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push race detected; retry $i/5"
            sleep $((i*5))
          done
          exit 1
