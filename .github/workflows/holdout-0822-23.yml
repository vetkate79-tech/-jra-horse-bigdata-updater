name: One-off V1.2 holdout 2026-08-22-23
on:
  push:
    paths:
      - '.github/workflows/holdout-0822-23.yml'
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install replay dependencies
        run: pip install pandas lxml html5lib beautifulsoup4
      - name: Collect target weekend from JRA
        env:
          TARGET_DATES: '2026-08-22,2026-08-23'
          TARGET_OUT: 'data/race_results_html_2026_holdout_0822_23.csv'
          JRA_TARGET_RACE_SEEDS: 'pw01sde0104202603010120260822/3B,pw01sde0107202603010120260822/19,pw01sde0101202602010120260822/2C,pw01sde1004202603020120260823/4A,pw01sde0107202603020120260823/49,pw01sde0101202602020120260823/5C'
        run: |
          python src/collect_jra_target_dates.py
          cp data/race_payouts_2026_weekend.csv data/race_payouts_2026_holdout_0822_23.csv
          git checkout -- data/race_payouts_2026_weekend.csv data/race_context_2026_weekend.csv status/html_collection_2026_weekend.json 2>/dev/null || true
      - name: Sanitize historical cards
        run: python src/run_holdout_replay_20260822_23.py prepare
      - name: Predict and SHA256 seal before result access
        run: python src/run_holdout_replay_20260822_23.py predict
      - name: Open results only after seal and score
        run: python src/run_holdout_replay_20260822_23.py score
      - name: Commit immutable holdout artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/race_results_html_2026_holdout_0822_23.csv data/race_payouts_2026_holdout_0822_23.csv validation/holdout_20260822_23_cards.json validation/holdout_20260822_23_v12_sealed.json docs/data/replay-holdout-2026-08-22-23.json docs/data/replay-axis-results-holdout-2026-08-22-23.json status/holdout-2026-08-22-23-v12.json
          git commit -m 'validation: score sealed V1.2 holdout 2026-08-22-23' || exit 0
          git push
