name: Audit oral v6 certification
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/audit_oral_golden_v6.py'
      - 'src/audit_oral_v6_robustness.py'
      - '.github/workflows/audit-oral-v6-certification.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/audit_oral_golden_v6.py
      - run: python src/audit_oral_v6_robustness.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-golden-v6-audit.json status/oral-v6-robustness-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Audit oral v6 certification gates'
          git pull --rebase origin main
          git push origin HEAD:main
