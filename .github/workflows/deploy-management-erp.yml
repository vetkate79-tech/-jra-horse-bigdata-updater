name: Deploy JRA Management ERP

on:
  workflow_run:
    workflows:
      - Race-week pure prediction seal
      - JRA market timing monitor
      - Post JRA meeting data update
      - Register upcoming JRA debut horses and race-week details
      - Build word dictionary and global links
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'validation/**'
      - 'data/race_results_html_2026*.csv'
      - 'src/build_august_validation_archive.py'
      - 'src/build_replay_page.py'
      - 'src/inject_global_word_links.py'
      - 'src/audit_public_model_exposure.py'
      - '.github/workflows/deploy-management-erp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Build fixed August one-race-one-prediction archive
        run: python src/build_august_validation_archive.py
      - name: Build canonical replay page
        run: python src/build_replay_page.py
      - name: Inject shared public navigation and word links
        run: python src/inject_global_word_links.py
      - name: Verify canonical replay page is immediately visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/replay/index.html').read_text(encoding='utf-8')
          assert '読込中' not in p
          assert p.count('class="race"') >= 36
          assert '36レース表示' in p
          assert 'JSON.parse' not in p
          assert 'innerHTML' not in p
          assert 'id="replay-data"' not in p
          assert '[hidden]{display:none!important}' in p
          assert p.count('class="dates date-group" data-month="2026-09"') == 1
          print('REPLAY_STATIC_RENDER_PASS')
          PY
      - name: Audit public artifact for prediction-model code exposure
        run: python src/audit_public_model_exposure.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build legacy GitHub Pages redirect
        run: |
          rm -rf legacy-pages
          mkdir -p legacy-pages
          cat > legacy-pages/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Moved</title>
          <link rel="canonical" href="https://jra-horse-data-collector-web.pages.dev/">
          <meta http-equiv="refresh" content="0;url=https://jra-horse-data-collector-web.pages.dev/">
          <script>
          const base='https://jra-horse-data-collector-web.pages.dev';
          const path=location.pathname.replace(/^\/-jra-horse-bigdata-updater/,'')||'/';
          location.replace(base+path+location.search+location.hash);
          </script>
          <a href="https://jra-horse-data-collector-web.pages.dev/">新しいJRA AI Webへ移動</a>
          HTML
          cp legacy-pages/index.html legacy-pages/404.html
      - name: Upload legacy redirect only
        uses: actions/upload-pages-artifact@v3
        with:
          path: legacy-pages
      - name: Deploy legacy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
