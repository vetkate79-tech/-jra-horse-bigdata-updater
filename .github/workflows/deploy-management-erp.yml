name: Deploy JRA Management ERP

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'validation/**'
      - 'data/race_results_html_2026*.csv'
      - 'src/build_august_validation_archive.py'
      - 'src/build_replay_page.py'
      - 'src/audit_public_model_exposure.py'
      - '.github/workflows/deploy-management-erp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build fixed August one-race-one-prediction archive
        run: python src/build_august_validation_archive.py
      - name: Build canonical replay page
        run: python src/build_replay_page.py
      - name: Verify canonical replay page is immediately visible
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/replay/index.html').read_text(encoding='utf-8')
          assert '読込中' not in p
          assert p.count('class="race"') >= 36
          assert '36レース表示' in p
          assert 'JSON.parse' not in p
          assert 'innerHTML' not in p
          assert 'id="replay-data"' not in p
          print('REPLAY_STATIC_RENDER_PASS')
          PY
      - name: Audit public artifact for prediction-model code exposure
        run: python src/audit_public_model_exposure.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
