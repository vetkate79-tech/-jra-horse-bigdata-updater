name: Deploy JRA Management ERP

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'validation/**'
      - 'data/race_results_html_2026*.csv'
      - 'src/build_august_validation_archive.py'
      - '.github/workflows/deploy-management-erp.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build fixed August one-race-one-prediction archive
        run: python src/build_august_validation_archive.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
