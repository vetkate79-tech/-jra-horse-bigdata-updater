name: Diagnose full field roles v5
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/diagnose_full_field_roles_v5.py'
      - '.github/workflows/diagnose-full-field-roles-v5.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas beautifulsoup4 lxml requests
      - run: python src/diagnose_full_field_roles_v5.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-full-field-role-diagnostic-v5.json
          git diff --cached --quiet && exit 0
          git commit -m 'Inspect all-field oral role candidates v5'
          git pull --rebase origin main
          git push origin HEAD:main
