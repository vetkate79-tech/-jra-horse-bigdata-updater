name: Build lightweight horse master

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/build_horse_base_catalog.py'
      - '.github/workflows/build-lightweight-horse-master.yml'
      - 'docs/data/horses/catalog.json'

permissions:
  contents: write

concurrency:
  group: horse-data-writes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build lightweight public horse master
        run: python src/build_horse_base_catalog.py
      - name: Validate generated master
        run: |
          python - <<'PY'
          import json
          p='docs/data/horses/base_catalog.json'
          d=json.load(open(p,encoding='utf-8'))
          n=len(d.get('horses',[]))
          assert n>0, 'base catalog is empty'
          assert all(h.get('horse_id') and h.get('horse_name') for h in d['horses'])
          print('validated', n, 'horses')
          PY
      - name: Commit lightweight horse master
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/horses/base_catalog.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: publish lightweight horse master'
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((i*3))
          done
          exit 1
