name: V1.4 rank profile research
on:
  push:
    paths:
      - '.github/workflows/research-v14-rank-profiles.yml'
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare leakage-safe rank profiles across both weekends
        run: python src/research_v14_rank_profiles.py
      - name: Commit research status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-v14-rank-profile-research.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: record V1.4 cross-week rank profile study'
          git pull --rebase origin main
          git push
