name: Build replay axis results

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/build_replay_axis_results.py'
      - 'docs/data/replay-demo-2026-08-29-30.json'
      - 'data/race_results_html_2026.csv'
      - '.github/workflows/build-replay-axis-results.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build axis result display data
        run: python src/build_replay_axis_results.py
      - name: Verify result labels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/replay-axis-results.json').read_text())
          assert d['prediction_input_use'] is False
          assert d['race_count'] > 0
          assert d['matched_count'] > 0
          assert all(x['evaluation'] in ('HIT','PLACE','MISS','UNKNOWN') for x in d['rows'])
          print({'race_count':d['race_count'],'matched_count':d['matched_count']})
          PY
      - name: Commit axis result display data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/replay-axis-results.json status/replay-axis-results.json
          git diff --cached --quiet && exit 0
          git commit -m 'Publish axis-first replay result labels'
          git pull --rebase origin main
          git push origin HEAD:main
