name: Race-week pure prediction seal

on:
  workflow_run:
    workflows:
      - Register upcoming JRA debut horses and race-week details
    types: [completed]
  schedule:
    - cron: '30 7 * * 4'   # Thursday 16:30 JST
    - cron: '30 1 * * 5'   # Friday 10:30 JST
    - cron: '30 1 * * 6'   # Saturday 10:30 JST
    - cron: '30 1 * * 0'   # Sunday 10:30 JST
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JRA date to seal (YYYY-MM-DD); blank = today JST'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/build_live_sealed_predictions.py'
      - 'src/build_live_sealed_predictions_v2.py'
      - 'src/publish_verified_today_predictions.py'
      - 'tests/test_publication_seal_firewall.py'
      - 'src/axis_survival_shadow.py'
      - 'src/monte_carlo_finalizer.py'
      - 'src/test_monte_carlo_shadow.py'
      - 'src/build_analysis_live_bundle.py'
      - 'requirements.txt'
      - 'src/oral_operational_layer.py'
      - 'src/build_management_erp.py'
      - 'docs/data/race_cards.json'
      - 'docs/data/horses/pre_race_features.json'
      - 'docs/data/horses/catalog.json'
      - 'docs/data/horses/base_catalog.json'
      - 'docs/data/upcoming_new_horses.json'
      - 'config/runtime_ownership.json'
      - 'config/prediction_target_date.json'
      - '.github/workflows/race-week-prediction-seal.yml'

permissions:
  contents: write

concurrency:
  group: live-prediction-seal
  cancel-in-progress: false

jobs:
  seal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Normal schedule/workflow_run must always use today's JST card set.
      # Historical/specified reseals are allowed only from workflow_dispatch input.
      JRA_TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
      JRA_MONTE_CARLO_EXPERIMENT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install prediction dependencies
        run: pip install -r requirements.txt
      - name: Smoke-test prediction runtime dependencies
        run: python -c "import numpy; import pandas; print('PREDICTION_RUNTIME_DEPS_OK')"
      - name: Compare Monte Carlo legacy against coverage-aware shadow on synthetic sparse inputs
        run: python src/test_monte_carlo_shadow.py
      - name: Regression-test sealed payload and status market firewall
        run: python -m unittest discover -s tests -p 'test_publication_seal_firewall.py' -v
      - name: Build leakage-safe live pure predictions
        run: python src/build_live_sealed_predictions_v2.py
      - name: Rebuild if JST date rolled over during prediction generation
        if: env.JRA_TARGET_DATE == ''
        run: |
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          status_path = Path('status/live_prediction_seal.json')
          status = json.loads(status_path.read_text(encoding='utf-8'))
          today = datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          if status.get('today_jst') != today:
              print(f'JST_DATE_ROLLOVER_REBUILD: generated={status.get("today_jst")} current={today}; regenerating before verification/publication')
              subprocess.run(['python', 'src/build_live_sealed_predictions_v2.py'], check=True)
              status = json.loads(status_path.read_text(encoding='utf-8'))
              after = datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
              if status.get('today_jst') != after:
                  raise RuntimeError(f'JST_DATE_ROLLOVER_REBUILD_FAILED: generated={status.get("today_jst")} current={after}; refusing stale publication')
          PY
      - name: Verify market/result firewall and new-horse V2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('status/live_prediction_seal.json').read_text())
          assert s['odds_popularity_used'] is False
          assert s['results_used'] is False
          assert s['status'] in ('SEALED','DATA_PENDING','NO_UPCOMING_RACES')
          assert s.get('new_horse_unrated_zone_enabled') is True
          assert s.get('new_horse_detection_all_zero_starts_enabled') is True
          assert s.get('simulation_finalizer_enabled') is True
          assert s.get('simulation_market_isolation') is True
          assert str(s.get('simulation_model_version') or '').startswith('MONTE_CARLO_FINALIZER_V2')
          assert int(s.get('simulation_runs_per_race') or 0) >= 10000 or s.get('status') in ('DATA_PENDING','NO_UPCOMING_RACES')
          if s.get('status') == 'SEALED':
              p=json.loads(Path('docs/data/live_predictions_sealed.json').read_text())
              for race in p.get('races') or []:
                  sim=race.get('simulation_finalizer') or {}
                  assert int(sim.get('runs') or 0) >= 10000
                  assert str(sim.get('model_version') or '').startswith('MONTE_CARLO_FINALIZER_V2')
                  assert sim.get('experiment_enabled') is True
                  assert sim.get('market_isolation') == 'NO_ODDS_OR_POPULARITY_OR_RESULTS_USED'
                  assert race.get('ranked_snapshot')
                  assert all((h.get('simulation') or {}).get('final_rank') for h in race.get('ranked_snapshot') or [])
          assert str(s.get('new_horse_model_version') or '').startswith('NEW_HORSE_DEDICATED_V2')
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          requested=(os.environ.get('JRA_TARGET_DATE') or '').strip()
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          if s.get('today_jst') != today:
              raise RuntimeError(f'JST_DATE_ROLLOVER: prediction built for {s.get("today_jst")}, verification now {today}; refusing stale publication; rerun seal for current JST date')
          if not requested:
              assert s.get('include_upcoming_dates') is True
              weekly=json.loads(Path('docs/data/horses/weekly_runner_details.json').read_text())
              active_dates=sorted({str(x) for x in (weekly.get('dates') or []) if str(x) >= today})
              sealed_dates=sorted({str(x) for x in (s.get('sealed_dates') or [])})
              if today in active_dates:
                  assert today in sealed_dates, {'today':today,'active_dates':active_dates,'sealed_dates':sealed_dates}
              assert set(active_dates).issubset(set(sealed_dates)), {'active_dates':active_dates,'sealed_dates':sealed_dates}
          else:
              assert s.get('target_date') == requested
              assert s.get('include_upcoming_dates') is False
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Verify each debut race uses the dedicated new-horse model and complete runner set
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('docs/data/live_predictions_sealed.json').read_text(encoding='utf-8'))
          weekly=json.loads(Path('docs/data/horses/weekly_runner_details.json').read_text(encoding='utf-8'))
          cards={}
          for x in weekly.get('runners') or []:
              r=x.get('race') or {}
              key=(str(r.get('date') or ''),str(r.get('track') or ''),int(r.get('race_no') or 0))
              cards.setdefault(key,{'name':str(r.get('race_name') or ''),'horses':set()})
              no=str(x.get('horse_no') or '').strip()
              if no: cards[key]['horses'].add(no)
          sealed={(str(r.get('date') or ''),str(r.get('track') or ''),int(r.get('race_no') or 0)):r for r in p.get('races') or []}
          # Weekly cards can retain completed meeting dates after a JST rollover.
          # Only require coverage for dates represented by this immutable seal;
          # never demand that a fresh empty seal reproduce yesterday's predictions.
          sealed_dates={key[0] for key in sealed}
          for key,card in cards.items():
              if key[0] not in sealed_dates:continue
              if not ('新馬' in card['name'] or 'メイクデビュー' in card['name']):continue
              if key not in sealed:raise AssertionError(('DEBUT_RACE_MISSING',key))
              race=sealed[key]
              analysis=race.get('analysis') or {}
              if not str(analysis.get('model_version') or '').startswith('NEW_HORSE_DEDICATED_V2'):
                  raise AssertionError(('DEBUT_WRONG_MODEL',key,analysis.get('model_version')))
              actual={str(h.get('n') or '') for h in race.get('ranked_snapshot') or []}
              unrated={str(h.get('n') or '') for h in race.get('unrated_dark_horses') or []}
              # A future card may not have numbered runners yet; do not compare blank identifiers as horses.
              if not card['horses']:
                  if actual - {''} or unrated - {''}:
                      raise AssertionError(('UNNUMBERED_DEBUT_HAS_NUMBERED_PREDICTIONS',key))
                  continue
              if '' in actual or '' in unrated or actual & unrated or actual|unrated != card['horses']:
                  raise AssertionError(('DEBUT_RUNNER_MISMATCH',key,sorted(card['horses']),sorted(actual),sorted(unrated)))
              sim=race.get('simulation_finalizer') or {}
              if int(sim.get('runs') or 0)<10000:
                  raise AssertionError(('DEBUT_SIMULATION_MISSING',key))
          print('DEBUT_MODEL_AND_RUNNER_COVERAGE_OK')
          PY
      - name: Publish auditable all-race pre-race ability ranking in action logs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p=json.loads(Path('docs/data/live_predictions_sealed.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          for r in sorted((x for x in p.get('races') or [] if x.get('date')==today),key=lambda x:(x.get('track') or '',int(x.get('race_no') or 0))):
              ranked=r.get('ranked_snapshot') or []
              a=r.get('analysis') or {}
              horses=[{'n':h.get('n'),'name':h.get('name'),'score':h.get('score'),'final_rank':(h.get('simulation') or {}).get('final_rank')} for h in ranked]
              if r.get('date')==today and r.get('track')=='東京' and int(r.get('race_no') or 0)==4:
                  print('JRA_TOKYO4_AUDIT '+json.dumps({'race':r,'seal_status':p.get('status'),'generated_at':p.get('generated_at'),'pre_race_feature_cutoff':p.get('pre_race_feature_cutoff'),'odds_popularity_used':p.get('odds_popularity_used'),'results_used':p.get('results_used')},ensure_ascii=False,separators=(',',':')))
              print('JRA_RACE_OUTPUT '+json.dumps({'date':r.get('date'),'track':r.get('track'),'race_no':r.get('race_no'),'race_name':r.get('race_name'),'model':a.get('model_version'),'horses':horses,'trio_tickets':a.get('trio_tickets'),'axis':a.get('axis'),'decision':a.get('decision')},ensure_ascii=False,separators=(',',':')))
          PY
      - name: Gate publication on a real sealed meeting
        id: publication_gate
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          status=json.loads(Path('status/live_prediction_seal.json').read_text(encoding='utf-8'))
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          if status.get('today_jst') != today:
              raise RuntimeError('refusing stale seal at publication gate')
          state=status.get('status')
          if state == 'SEALED':
              decision='true'
          elif state == 'NO_UPCOMING_RACES':
              weekly=json.loads(Path('docs/data/horses/weekly_runner_details.json').read_text(encoding='utf-8'))
              current=[x for x in weekly.get('runners') or [] if str((x.get('race') or {}).get('date') or '')==today]
              if current:
                  raise RuntimeError(f'NO_UPCOMING_RACES conflicts with {len(current)} current-day runners')
              decision='false'
              print('NO_CURRENT_MEETING: safely skip publication and ERP refresh; do not modify historical sealed output')
          else:
              raise RuntimeError(f'publication blocked by unresolved seal state: {state}')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'publish={decision}\\n')
          PY
      - name: Publish and verify complete current-day race prediction feed
        if: steps.publication_gate.outputs.publish == 'true'
        run: python src/publish_verified_today_predictions.py
      - name: Block publication unless every runner has verified simulation probabilities
        if: steps.publication_gate.outputs.publish == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          today=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          p=json.loads(Path('docs/data/live_predictions_today_verified.json').read_text(encoding='utf-8'))
          s=json.loads(Path('docs/data/live_predictions_sealed.json').read_text(encoding='utf-8'))
          assert p.get('date')==today and p.get('status')=='VERIFIED'
          assert p.get('source_prediction_hash') and p['source_prediction_hash']==s.get('prediction_hash_sha256')
          races=p.get('races') or []
          assert races and p.get('race_count')==len(races)
          for r in races:
              assert r.get('date')==today
              assert int(r.get('simulation_runs') or 0)>=10000
              assert r.get('pre_market_decision') in ('BUY','CAUTION','PASS')
              assert r.get('axis_durability') is not None
              assert r.get('formation_columns') is not None
              horses=r.get('horses') or []
              assert horses
              for h in horses:
                  for field in ('score','final_rank','win_rate','place_rate','top3_rate','scenario_stability','scenario_top3'):
                      assert h.get(field) is not None,(r.get('track'),r.get('race_no'),h.get('horse_no'),field)
                  assert 0<=float(h['win_rate'])<=float(h['place_rate'])<=float(h['top3_rate'])<=1
                  assert 0<=float(h['scenario_stability'])<=1
                  assert set(h['scenario_top3'])=={'SLOW_FRONT','AVERAGE','FAST_BALANCED','FAST_CLOSER','EXTREME_COLLAPSE'}
          print('ALL_RUNNERS_PROBABILITY_PUBLICATION_GATE_PASS',len(races))
          PY
      - name: Refresh management ERP from the new sealed predictions
        if: steps.publication_gate.outputs.publish == 'true'
        run: python src/build_management_erp.py
      - name: Build same-origin advanced-analysis live bundle
        if: steps.publication_gate.outputs.publish == 'true'
        run: python src/build_analysis_live_bundle.py
      - name: Commit immutable-style seal artifact
        if: steps.publication_gate.outputs.publish == 'true'
        run: |
          git config user.name 'jra-prediction-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/live_predictions_today_verified.json docs/data/live_predictions_sealed.json docs/data/live_predictions_champion_*.json docs/data/prediction-seal-history docs/data/dashboard.json docs/data/management_analytics.json docs/analysis/live-seal.js status/live_prediction_seal.json status/management_erp.json
          git diff --cached --quiet && exit 0
          git commit -m 'prediction: seal race-week pure predictions'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
