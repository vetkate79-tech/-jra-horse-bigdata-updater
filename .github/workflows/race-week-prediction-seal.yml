name: Race-week pure prediction seal

on:
  workflow_run:
    workflows:
      - Register upcoming JRA debut horses and race-week details
    types: [completed]
  schedule:
    - cron: '30 7 * * 4'   # Thursday 16:30 JST
    - cron: '30 1 * * 5'   # Friday 10:30 JST
    - cron: '30 1 * * 6'   # Saturday 10:30 JST
    - cron: '30 1 * * 0'   # Sunday 10:30 JST
  workflow_dispatch:
    inputs:
      target_date:
        description: 'JRA date to seal (YYYY-MM-DD); blank = today JST'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'src/build_live_sealed_predictions.py'
      - 'src/build_live_sealed_predictions_v2.py'
      - 'src/axis_survival_shadow.py'
      - 'src/monte_carlo_finalizer.py'
      - 'src/oral_operational_layer.py'
      - 'src/build_management_erp.py'
      - 'docs/data/race_cards.json'
      - 'docs/data/horses/pre_race_features.json'
      - 'docs/data/horses/catalog.json'
      - 'docs/data/horses/base_catalog.json'
      - 'docs/data/upcoming_new_horses.json'
      - 'config/runtime_ownership.json'
      - 'config/prediction_target_date.json'
      - '.github/workflows/race-week-prediction-seal.yml'

permissions:
  contents: write

concurrency:
  group: live-prediction-seal
  cancel-in-progress: true

jobs:
  seal:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build leakage-safe live pure predictions
        env:
          JRA_TARGET_DATE: ${{ github.event.inputs.target_date || vars.JRA_TARGET_DATE || '' }}
        run: python src/build_live_sealed_predictions_v2.py
      - name: Verify market/result firewall and new-horse V2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('status/live_prediction_seal.json').read_text())
          assert s['odds_popularity_used'] is False
          assert s['results_used'] is False
          assert s['status'] in ('SEALED','DATA_PENDING','NO_UPCOMING_RACES')
          assert s.get('new_horse_unrated_zone_enabled') is True
          assert s.get('new_horse_detection_all_zero_starts_enabled') is True
          assert s.get('simulation_finalizer_enabled') is True
          assert s.get('simulation_market_isolation') is True
          assert str(s.get('simulation_model_version') or '').startswith('MONTE_CARLO_FINALIZER_V1')
          assert int(s.get('simulation_runs_per_race') or 0) >= 10000 or s.get('status') in ('DATA_PENDING','NO_UPCOMING_RACES')
          if s.get('status') == 'SEALED':
              p=json.loads(Path('docs/data/live_predictions_sealed.json').read_text())
              for race in p.get('races') or []:
                  sim=race.get('simulation_finalizer') or {}
                  assert int(sim.get('runs') or 0) >= 10000
                  assert sim.get('market_isolation') == 'NO_ODDS_OR_POPULARITY_OR_RESULTS_USED'
                  assert race.get('ranked_snapshot')
                  assert all((h.get('simulation') or {}).get('final_rank') for h in race.get('ranked_snapshot') or [])
          assert str(s.get('new_horse_model_version') or '').startswith('NEW_HORSE_DEDICATED_V2')
          if not __import__('os').environ.get('JRA_TARGET_DATE'):
              assert s.get('include_upcoming_dates') is True
          print(json.dumps(s,ensure_ascii=False,indent=2))
          PY
      - name: Refresh management ERP from the new sealed predictions
        run: python src/build_management_erp.py
      - name: Commit immutable-style seal artifact
        run: |
          git config user.name 'jra-prediction-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/live_predictions_sealed.json docs/data/live_predictions_champion_*.json docs/data/prediction-seal-history docs/data/dashboard.json docs/data/management_analytics.json status/live_prediction_seal.json status/management_erp.json
          git diff --cached --quiet && exit 0
          git commit -m 'prediction: seal race-week pure predictions'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
