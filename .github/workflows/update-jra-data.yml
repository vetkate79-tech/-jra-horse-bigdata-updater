name: Update JRA horse big data

on:
  workflow_dispatch:
    inputs:
      year:
        description: Target year
        required: false
        default: "2025"
      mode:
        description: registry, profile, history, or all
        required: false
        default: "all"
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: write

concurrency:
  group: jra-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update data
        env:
          TARGET_YEAR: ${{ inputs.year || '2025' }}
          UPDATE_MODE: ${{ inputs.mode || 'all' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python src/update_registry.py
      - name: Commit data and status
        run: |
          git config user.name "jra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data status
          git diff --cached --quiet || git commit -m "data: automated JRA update"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: jra-update-${{ github.run_number }}
          path: |
            data/
            status/
          retention-days: 30
