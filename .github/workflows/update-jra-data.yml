name: Update JRA horse big data

on:
  workflow_dispatch:
    inputs:
      year:
        description: Target year
        required: false
        default: "2026"
      scope:
        description: full_year or previous_weekend
        required: false
        default: "full_year"
      mode:
        description: registry, profile, history, or all
        required: false
        default: "all"
  schedule:
    - cron: "0 21 * * 0"

permissions:
  contents: write

concurrency:
  group: jra-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-jpn imagemagick
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update data
        env:
          TARGET_YEAR: ${{ inputs.year }}
          UPDATE_MODE: ${{ inputs.mode }}
          UPDATE_SCOPE: ${{ github.event_name == 'schedule' && 'previous_weekend' || inputs.scope || 'full_year' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          TARGET_YEAR="${TARGET_YEAR:-$(TZ=Asia/Tokyo date +%Y)}" \
          UPDATE_MODE="${UPDATE_MODE:-all}" \
          UPDATE_SCOPE="${UPDATE_SCOPE:-full_year}" \
          python src/update_registry.py
      - name: Validate history and rebuild profiles three times
        run: |
          if [ -f data/race_results.csv ]; then
            python src/build_horse_profiles.py
            FIRST_HASH="$(sha256sum data/horse_profiles.csv | cut -d ' ' -f1)"
            python src/build_horse_profiles.py
            SECOND_HASH="$(sha256sum data/horse_profiles.csv | cut -d ' ' -f1)"
            python src/build_horse_profiles.py
            THIRD_HASH="$(sha256sum data/horse_profiles.csv | cut -d ' ' -f1)"
            test "$FIRST_HASH" = "$SECOND_HASH"
            test "$SECOND_HASH" = "$THIRD_HASH"
          else
            echo "race_results.csv not present; history/profile stage remains blocked"
          fi
      - name: Evaluate chronological backtest when predictions exist
        run: |
          if [ -f data/model_predictions.csv ]; then
            python src/evaluate_backtest.py
          else
            echo "model_predictions.csv not present; backtest remains blocked"
          fi
      - name: Commit data and status
        run: |
          git config user.name "jra-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data status
          git diff --cached --quiet || git commit -m "data: automated JRA update"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: jra-update-${{ github.run_number }}
          path: |
            data/
            status/
          retention-days: 30
