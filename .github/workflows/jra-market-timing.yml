name: JRA market timing monitor

on:
  schedule:
    - cron: '*/10 * * * 4,5,6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  timing-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Evaluate prediction and odds checkpoints
        env:
          TZ: Asia/Tokyo
        run: python src/market_timing_gate.py
      - name: Commit timing status
        run: |
          git config user.name 'jra-market-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/market_watch_status.json
          git diff --cached --quiet || git commit -m 'data: update market timing status'
          git push
