name: JRA market timing monitor

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 min; due-gate enforces hourly / T-30 5-min cadence
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/collect_current_market_odds.py'
      - 'src/market_collection_due.py'
      - 'src/market_timing_gate.py'
      - '.github/workflows/jra-market-timing.yml'

permissions:
  contents: write

concurrency:
  group: market-status-writes
  cancel-in-progress: true

jobs:
  timing-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime dependencies
        run: pip install -r requirements.txt
      - name: Check whether market refresh is due
        id: due
        env:
          TZ: Asia/Tokyo
        run: python src/market_collection_due.py
      - name: Collect current JRA win odds
        if: steps.due.outputs.run_collection == 'true'
        env:
          TZ: Asia/Tokyo
          SNAPSHOT_SLOT: ${{ steps.due.outputs.slot }}
        run: python src/collect_current_market_odds.py
      - name: Evaluate independent odds checkpoints
        if: steps.due.outputs.run_collection == 'true'
        env:
          TZ: Asia/Tokyo
        run: python src/market_timing_gate.py
      - name: Commit only semantic market-state changes
        if: steps.due.outputs.run_collection == 'true'
        run: |
          git config user.name 'jra-market-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/market_watch_status.json docs/data/current_market_odds.json docs/data/market-odds-history status/current_market_odds.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: update market timing state'
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
