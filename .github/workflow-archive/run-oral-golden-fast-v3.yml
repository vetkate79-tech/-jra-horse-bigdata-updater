name: Run oral golden fast v3
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/run_oral_golden_fast_v3.py'
      - '.github/workflows/run-oral-golden-fast-v3.yml'
permissions:
  contents: write
jobs:
  fast-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas beautifulsoup4 lxml requests
      - run: python src/run_oral_golden_fast_v3.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/oral-golden-fast-v3.json
          git diff --cached --quiet && exit 0
          git commit -m 'Run current-class oral golden regression v3'
          git pull --rebase origin main
          git push origin HEAD:main
