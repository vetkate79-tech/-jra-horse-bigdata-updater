name: Inspect 2025 rolling validation source
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/inspect_2025_rolling_validation_source.py'
      - '.github/workflows/inspect-2025-rolling-source.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/inspect_2025_rolling_validation_source.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/rolling-validation-2025-source.json
          git diff --cached --quiet && exit 0
          git commit -m 'Inspect 2025 rolling validation source'
          git pull --rebase origin main
          git push origin HEAD:main
