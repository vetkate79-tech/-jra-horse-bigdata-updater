name: Select V9 direction
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/select_v9_from_v8_diagnostics.py'
      - 'status/oral-v8-improvement-diagnostic.json'
      - '.github/workflows/select-v9-plan.yml'
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select V9 direction or record waiting state
        run: python src/select_v9_from_v8_diagnostics.py
      - name: Validate selection artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('status/oral-v9-selection-plan.json')
          assert p.exists()
          d=json.loads(p.read_text())
          assert d.get('status') in ('READY','WAITING_FOR_V8_DIAGNOSTIC')
          print(json.dumps(d,ensure_ascii=False,indent=2))
          PY
      - name: Commit selection state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/oral-v9-selection-plan.json
          git diff --cached --quiet && exit 0
          git commit -m 'Select V9 direction from V8 diagnostics'
          git pull --rebase origin main
          git push origin HEAD:main
