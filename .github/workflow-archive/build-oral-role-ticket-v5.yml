name: Build oral role ticket v5
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/build_oral_role_ticket_v5.py'
      - '.github/workflows/build-oral-role-ticket-v5.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python src/build_oral_role_ticket_v5.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/oral-golden-fast-v5.json
          git diff --cached --quiet && exit 0
          git commit -m 'Build role-diversified oral tickets v5'
          git pull --rebase origin main
          git push origin HEAD:main
