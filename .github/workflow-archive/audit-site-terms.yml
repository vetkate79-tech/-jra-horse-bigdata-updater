name: Audit site terminology coverage

on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.html'
      - 'docs/**/*.js'
      - 'docs/data/site-terms.json'
      - 'docs/data/site-terms-extra.json'
      - 'docs/data/glossary.json'
      - 'src/build_site_term_candidates.py'
      - 'src/build_word_dictionary_pages.py'
      - '.github/workflows/audit-site-terms.yml'

permissions:
  contents: write

concurrency:
  group: site-term-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build uncovered term candidates
        run: python src/build_site_term_candidates.py
      - name: Rebuild public word index and pages
        run: python src/build_word_dictionary_pages.py
      - name: Commit terminology outputs
        run: |
          git config user.name 'jra-data-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/data/site-term-candidates.json status/site_term_coverage.json docs/data/word-index.json docs/words
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh self-contained site terminology'
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i*2))
          done
          exit 1
