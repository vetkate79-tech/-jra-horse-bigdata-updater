name: Build 72R pretarget feature cache
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/build_pretarget_feature_cache_72.py'
      - '.github/workflows/build-pretarget-feature-cache-72.yml'
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas beautifulsoup4 lxml requests
      - run: python src/build_pretarget_feature_cache_72.py
      - name: Verify cache isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/pretarget-feature-cache-72.json').read_text())
          assert d['race_count']==72
          assert d['result_data_used'] is False and d['odds_popularity_used'] is False and d['target_result_rows_used'] is False
          assert d['feature_cache_hash_sha256']
          print({'races':d['race_count'],'hash':d['feature_cache_hash_sha256']})
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/pretarget-feature-cache-72.json status/pretarget-feature-cache-72.json
          git diff --cached --quiet && exit 0
          git commit -m 'Cache sealed pretarget features for 72R iteration'
          git pull --rebase origin main
          git push origin HEAD:main
