name: Run oral golden fast v2

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/run_oral_golden_fast_v2.py'
      - 'docs/data/oral-chat-golden-cases.json'
      - '.github/workflows/run-oral-golden-fast-v2.yml'

permissions:
  contents: write

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas beautifulsoup4 lxml requests
      - name: Run fast golden regression
        run: python src/run_oral_golden_fast_v2.py
      - name: Commit fast result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/oral-golden-fast-v2.json
          git diff --cached --quiet && exit 0
          git commit -m 'Run fast oral golden regression'
          git pull --rebase origin main
          git push origin HEAD:main
