name: Audit oral system parity

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/audit_oral_system_parity.py'
      - 'src/extract_oral_parity_cases.py'
      - 'src/final_oral_system_audit.py'
      - 'src/oral_operational_layer.py'
      - 'docs/data/replay-demo-2026-08-29-30.json'
      - 'docs/data/replay-2026-08-29-30-sealed.json'
      - 'docs/data/oral-integrated-v1-shadow-sealed.json'
      - '.github/workflows/audit-oral-system-parity.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare archived oral outputs with system outputs
        run: python src/audit_oral_system_parity.py
      - name: Extract detailed regression cases
        run: python src/extract_oral_parity_cases.py
      - name: Final completion audit
        run: python src/final_oral_system_audit.py
      - name: Verify audit artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/data/oral-system-parity-audit.json').read_text())
          c=json.loads(Path('docs/data/oral-parity-case-details.json').read_text())
          f=json.loads(Path('docs/data/oral-system-final-audit.json').read_text())
          assert d['historical_chat_parity']['actual_pre_race_logs'] > 0
          assert d['invariant_tests']['race_count'] == 72
          assert c['case_count'] >= 4
          assert len(f['tests']) >= 10
          print(json.dumps({
            'verdict':f['verdict'],
            'tests':f['tests'],
            'hard_blockers':f['hard_blockers'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Commit audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/oral-system-parity-audit.json status/oral-system-parity-audit.json docs/data/oral-parity-case-details.json docs/data/oral-system-final-audit.json status/oral-system-final-audit.json
          git diff --cached --quiet && exit 0
          git commit -m 'Complete oral-system parity audit suite'
          git pull --rebase origin main
          git push origin HEAD:main
